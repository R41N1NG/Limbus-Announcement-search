题被错误标注了「feat. Ryōshū」。\n2. 原因\n•    在提交音乐文件的过程中，错误版本的音源被上传。\n•    由于音乐平台端的错误，「参与艺人」栏被错误标记。\n此次问题源于音乐文件提交与登记流程中的审核不足，对此我们深表歉意。\n3. 处理措施\n•    目前音乐平台端无法立即完成处理；我们计划于明日上午将现有歌曲替换为正式完成版本，并将尽最大努力尽快解决该问题。\n•    关于「参与艺人」栏显示错误名称的问题，我们正在调查原因，并将在确认后尽快修正。\n对于此次错误版本歌曲发布所造成的混乱与失望，我们再次致以诚挚的歉意。\n今后我们将强化音乐文件提交时的审核流程，以防止类似问题再次发生。","read_status":"已读取页面；图片内容按需局部核对，未全文校对","images":[]},{"article_id":46314451,"title":"[零协汉化]2026上半年路线图直播Part2听译：总监的心路历程","url":"https://www.bilibili.com/read/cv46314451","published_date":"2026-02-28","category":"直播整理资料","reason":"文章为直播PPT、听译或全内容整理；与Steam直播预告或简要路线图为不同材料，不作为同篇公告对应。","date_review":"本轮按北京时间筛选发布前7天至发布后3天，共16条Steam候选。文章为直播PPT、听译或全内容整理；与Steam直播预告或简要路线图为不同材料，不作为同篇公告对应。","date_candidates":[{"id":"1825727806719498","date":"2026-03-03","title":"[Notice: The Index Nursefather Yi Sang Identity Growth Pack Sales Period Error]","url":"https://steamstore-a.akamaihd.net/news/externalpost/steam_community_announcements/1825727806719498"},{"id":"1825727806717017","date":"2026-03-02","title":"2026.03.05 (KST) The 8th Walpurgis Night Target Extraction","url":"https://steamstore-a.akamaihd.net/news/externalpost/steam_community_announcements/1825727806717017"},{"id":"1825727806717002","date":"2026-03-02","title":"2026, Mar. 5th Scheduled Update Notice","url":"https://steamstore-a.akamaihd.net/news/externalpost/steam_community_announcements/1825727806717002"},{"id":"1825727806716962","date":"2026-03-02","title":"New Event - The 8th Walpurgis Night","url":"https://steamstore-a.akamaihd.net/news/externalpost/steam_community_announcements/1825727806716962"},{"id":"1825727806710634","date":"2026-02-27","title":"Limbus Company 2026 H1 Roadmap Information","url":"https://steamstore-a.akamaihd.net/news/externalpost/steam_community_announcements/1825727806710634"},{"id":"1825727806710420","date":"2026-02-27","title":"[Limbus Company] 3rd Anniversary Animation","url":"https://steamstore-a.akamaihd.net/news/externalpost/steam_community_announcements/1825727806710420"},{"id":"1825727806710265","date":"2026-02-27","title":"The 8th Walpurgis Night - PV","url":"https://steamstore-a.akamaihd.net/news/externalpost/steam_community_announcements/1825727806710265"},{"id":"1825727806710191","date":"2026-02-27","title":"[Limbus Company] 3rd Anniversary PV","url":"https://steamstore-a.akamaihd.net/news/externalpost/steam_community_announcements/1825727806710191"},{"id":"1825727806710021","date":"2026-02-27","title":"Limbus Company 3rd Anniv. & Roadmap Livestream","url":"https://steamstore-a.akamaihd.net/news/externalpost/steam_community_announcements/1825727806710021"},{"id":"1825727806709864","date":"2026-02-27","title":"Notice: Cursed E.G.O Non-functionality Issue","url":"https://steamstore-a.akamaihd.net/news/externalpost/steam_community_announcements/1825727806709864"},{"id":"1825727806709565","date":"2026-02-27","title":"Notice: Hotfix for Cursed E.G.O Gifts Not Appearing","url":"https://steamstore-a.akamaihd.net/news/externalpost/steam_community_announcements/1825727806709565"},{"id":"1825727806706868","date":"2026-02-26","title":"Notice: Additional Improvements & Known Issues in Ver. 1.99.1, updated Feb. 26th","url":"https://steamstore-a.akamaihd.net/news/externalpost/steam_community_announcements/1825727806706868"},{"id":"1825727806704117","date":"2026-02-25","title":"Limbus Company 3rd Anniversary and Future Roadmap Livestream","url":"https://steamstore-a.akamaihd.net/news/externalpost/steam_community_announcements/1825727806704117"},{"id":"1825093633193457","date":"2026-02-23","title":"2026, Feb. 26th Scheduled Update Notice","url":"https://steamstore-a.akamaihd.net/news/externalpost/steam_community_announcements/1825093633193457"},{"id":"1825093633193434","date":"2026-02-23","title":"Feb. 26th New Content - Mirror of Names and Spiders Hard Difficulty","url":"https://steamstore-a.akamaihd.net/news/externalpost/steam_community_announcements/1825093633193434"},{"id":"1825093633193406","date":"2026-02-23","title":"New Content - 3rd Anniversary Event","url":"https://steamstore-a.akamaihd.net/news/externalpost/steam_community_announcements/1825093633193406"}],"body_text":"译：卷师\n本次直播的全部主要相关内容已翻译完毕，再次非常感谢大家的努力。\n接下来要讲一些有关公司内部的深邃话题，不喜欢这类话题的各位看到这里就可以了。\nMenhera time（郁娇时间）：\n接下来的部分没有准备PPT，所以通过日语和英语观看直播的各位可能会难以理解。\n各位，我们需要同步一下有关月亮计划的方向相关的信息与想法。\n月亮计划是为了做我“金智勋”想做的事情而创立的公司。现在压根已经没有其他投资人了。今年4月初的时候我们会需要公开2025年的财务情况。总之大家到时候会明白我们营业额很多，这也确实是为了挣钱没错。\n我来单刀直入地讲讲为什么没有出通贩，以及为什么不招人。这也是老生常谈了，人际关系这方面我要接触的人越多压力就越大，那就顶不住了。不管怎么说，我都得留着一口气活在这世上才能继续开发游戏。因此假设我要开始通贩的话，那要么就得在火腿嘭嘭这里招募更多人手来办这件事，要么就得委托其他公司代理一下。\n招人这件事，说着轻松，但是一旦招了人就很难反悔了。各位玩家和顾客为什么要担心我们公司的事情呢。其实大家并不需要替我们担心。招更多人的话，我就难以专心创作了，根本就做不了游戏了。我本来得写剧情，但是如果要跟更多新增的负责人以及其他公司打交道，并确保事态依然在我的掌控之中的话，那会导致我在游戏剧情这方面投入的“金智勋元素”减少。假设原来游戏的含“金”量在90%的话，一旦我通贩招人就会导致含“金”量逐步下跌直至0.1%，就跟虾片里的含“虾”量一样少。现在这么做只是为了保住我自己，同时也是为了喜欢我所创作的故事的各位。总之不管怎样我都得留着这条命才能办成后面的事。\n我也想像大家说的那样少干活多赚钱，我不知道我后续的创作质量会怎样，但我的目标是一直坚持一路向前。我每次都要提一嘴月活和日活，月活最高达到130万，看着曲线一路攀升我当然也很高兴，但就算走下坡路也是没关系的。我要维持我身为“智勋”的自我（ego），保持自己的思维与生活并继续创作。哪怕走下坡路也没关系，哪怕我显得有些业余，哪怕我把公司弄得跟社团似的，老是有人说“赚了那么多钱，不该负起相应的责任吗”之类的话，我们这边连退职金都备好了而且也从不拖欠员工的工资，我们还一直都在努力工作，都做到这个份上了还能怎样负更多责任啊。\n就连这次快闪活动也是我想办才办的，线下快闪活动多酷啊。这过程中是有些运营不慎的事情，但我实在是想不到更好的解决方案了。如果有人对此感到不适的话，我也束手无策，这只能分道扬镳了。总之各位粉丝想要的难道不是智勋创作的游戏和创作的故事吗。但如果一直让我做这做那的话我就无法创作那些内容了。我以前说过我有抑郁和躁郁症之类的麻烦，但我现在持有公司96%的股份，没有其他投资人，只要还清债务并支付所有退职金，我就可以直接让这个公司解散，没有任何人可以阻止我，而且这一行为也完全合法合规。只要按下这个“清算”按钮，公司就会灰飞烟灭。\n总之我只会确保自己不饿死并一直坚持做游戏，所以大家其实不用期待我有过于内行过于专业的表现。顺其自然，能得到好的结果就是好事。总之不能操之过急，本来我自己就有点急，结果身边的氛围也急起来了，我都快失去理智了。\n我的公司已经快有10年了，在这期间我见过不少前辈以及创业者们一败涂地，但我依旧得到了大家的认可和称赞，所以我打算继续保持。不管是员工还是粉丝，大家都说责任感很重要，但我自己得先活着才能负起责任什么的吧。\n总之我现在无债一身轻，也不必屈人之下。这纯粹就是我的自我实现、我的兴趣爱好、我的社团。老是有人说我身为公司的法人代表，持有95%以上的股份却把公司运营成了社团的样子，而这终究是公司不是社团。怎么能这么说呢。这就是我的公司，办成这样就是我的旨意啊。\n想想看，如果上市的话就会有股东，如果公司的业绩不理想或者对发展方向有意见的话，这些股东是可以通过开会之类的手段换掉公司代表的；就算是没有上市的公司，也会因为存在一些外部的投资方，导致公司代表为了满足投资方的预期而不得不拼命挣钱。但我现在不仅公司未上市，而且上头也没有投资方了，公司处于一种由金智勋完全掌控的，称帝一般的状态。\n总之这次快闪活动真的蛮对不起许多人的，我也会努力解决相应的问题。但这真不是立马招人或怎么样就能解决的问题，我也希望能有让这些麻烦迎刃而解的对策。现在公司里就有600亿韩元，但是也有金钱无法解决的问题，我就是有钱我也做不到。所以我只打算坚持做我想做的事情。总之月亮计划举办线下活动，搞砸可能是家常便饭，所以要么放平心态敬而远之，要么就跟我一起摸爬滚打寻找对策，大家只能在这之中二选一。\n最高130万的月活是有可能下跌，但是招人也会造成波动的。招人这件事本身就是一种责任，一旦选完了人就要负责。哎呀，真的好烦。\n我刚才提及了金额，是因为反正今年4月初的时候就都需要公开。在韩国，哪怕是没有上市的公司，只要营业额达到了一定限度就都要公开盈利情况。到时候大家一看就会明白，2025年的数值非常了不起。但就算如此也都一样，这其中依旧有95%是属于我的。只要我按下清算按钮宣布我不干了，那么当我支付一半的钱作为税金也就是300亿韩元，然后自己带走剩下的一半，公司也就到此为止了。什么都阻止不了我。这么做当然意味着我在游戏行业也就到此为止了，然后就得转去当吃播了。但当我觉得我要死了的时候，还能怎么办呢。\n我们跟一般的公司是不一样的，一般运营了10年的公司是不可能没有债务或投资关系的。但我，月亮计划的金智勋，没有负债。啊之前是有50亿韩元的债额但早就已经还完了。总之已经没有问题了。这事实上是一场大型的自我实现，是我的E.G.O，是我的兴趣爱好，是我想要坚持数十载的我的人生。大家都明白了吗。\n啊，有人说我将“社团活动”当作盾牌，当作借口，以做我想做的事。是这样没错。但我也是束手无策，就算想做得比现在更好也做不到。而且招人这方面的事我一两年前也已经在各位公司代表、游戏大厂的高层以及投资方代表的口中听过了，我都统一回复说我不想招人了。我要是乐意的话，我可以把公司以1000亿韩元以上的价格卖给中国的游戏厂商，但是我拒绝了。就连评估我们公司价值为8000亿-1兆韩元，想把公司买走的中国厂商我也拒绝了。\n大家还能在这基础上期待什么呢。在我们办活动的时候，大家就算路过时吐槽一下再回来凑凑热闹也都行。我的这些话不是说给骂月亮计划的人听的，而是说给喜欢着月亮计划，但却听信了某些危言耸听的话语而为我们感到心痛的粉丝们，想让各位不要为我们感到担忧。\n总之我会坚定不移地走下去。如果一味地为了钱而运营企业，那还有什么“金智勋风味”可言呢。如果没有这种风味的话，大家就肯定都要离开了吧。到现在这种程度我们差不多已经是共生关系了。我作为供给者提供一些只属于我的东西，然后有需求的人就会接受我给出的作品。这就是共生啊。\n在互联网上将“月亮计划要一辈子把社团活动当作盾牌”的事情广而告之呗。哎哟这个公司代表只需要走清算程序就可以缴税支付退职金然后卷着300亿韩元走人全程合法合规。各位员工也请听好。大家要做我喜欢的东西，并献上一切。我给予了那么多的鼓励，开出高达9000万韩元的年薪，所有这些要求当然都包含在内。我虽然让大家干很多活，但待遇什么的也从来没有落下。\n总之就是做我想做的事吧。不管是热爱月亮计划的粉丝还是第一次看我直播的路人，我只想说，我会不论兴衰地一直坚持下去。补充一点，如果月活跌到20万的话，我就调整计划。\n我都已经吃了6年躁郁症的药了。都这样了我也依然在创作的时候考虑怎样才能更有趣，怎样调整公司内部氛围；至于在这基础上招人啊，通贩啊，多为顾客着想啊什么的，我是真的心有余而力不足。这些话已经不知道说了多少遍了。我也感到惋惜，感到心痛，但是我心有余而力不足。这已经超出我的能力了。\n现在既没有什么投资方施压也没有什么股东干涉，也没有什么理事会在上头管我。我就是想边吃泡面边直播都行。可能有些粉丝会觉得这样运营会把公司搞垮，还要指指点点的。但是月亮计划就算这样也不会倒下，这是家特殊的公司，或许也只有我能做到这种事吧。总之看到现在的各位员工如果有什么想问的事情可以在工作群中发表疑问。\n然后插播一下招聘公告。我们是有在招募人手的，但是大家在应聘之前一定要了解所有须知事项。\n我也想快点创作出新的内容，但是如果为了赶工而写出了没意思的故事的话，我也会觉得很无聊，所以我又能有什么办法呢。也有人吐槽说哪有主线章节延期六七个月的游戏之类的，但是从第四章到第八章的过程中不管是文本量还是插画数量还是游戏演出内容全都在不停膨胀，要是能一直保持第四章的体量的话还说不定，但是这些一直都在膨胀啊。我希望喜欢月亮计划游戏的各位也能了解这种情况。\n总之我在第十章中也要为大家带来精彩的内容。\n现在我们工作群里已经有60人了，但是我没什么想要交流的欲望，与大家的互动也没以前那么频繁，可能直播结束时我们也就象征性地打打招呼。现在比起以前要冷清一些，但暂时也没别的办法，总之为了提高第十章的相关内容品质，我们需要更多人手。我们需要共度难关。\n现在是2026年，我希望等到了2050年、2070年的时候也能像这样开直播。大家应该也知道我是个多虑的人，要是团队扩招到100人甚至150人，公司马上就要完蛋的。所以我想一点一点慢慢地扩充团队。这不是因为办公楼没有竣工所以就不敢招人，哪怕竣工了也不意味着我要招满100人，好像有人误解了我的话。这不是办公楼的问题，而是我的问题，只是名为“金智勋”的人的问题。\n总之很感谢喜欢月亮计划游戏的各位。总之由于各种原因觉得感情淡了要离开的各位，分道扬镳也没关系。如果你们有一天再回来玩的话，会有很多积攒起来的新内容等着你们。游戏总会有多种多样的风格，世上也有很多优秀的游戏厂家与优秀的游戏，所以我要保持我自己的节奏。\n总之我承认自己是把“社团活动”当作借口做我想做的事情，但我确实也没别的办法。\n2月28日的签名会是从10:30开始的，然后也请各位留意招聘公告。\n那么3周年直播到此为止。\n总之我是想名利双收，少劳多得。人们都想这样，不是吗。我要是真的掉钱眼里的话，不早就走清算流程卷钱走人了吗。\n总之我爱大家，希望我们十年二十年三十年后依旧能在直播中像这样分享郁郁时刻。总之加油！再——（*直播结束）","read_status":"已读取页面；图片内容按需局部核对，未全文校对","images":["http://i0.hdslb.com/bfs/new_dyn/b82e8cd83c0576bff507b3c16c07d0da3632319835409017.png","http://i0.hdslb.com/bfs/new_dyn/2abbce9e9f785d7c6cd65083f5921e4a3632319835409017.png"]},{"article_id":46310041,"title":"[零协汉化]2026上半年路线图直播PPT翻译（下）：9.5双间章、良秀高光人格、六号线、第十章等","url":"https://www.bilibili.com/read/cv46310041","published_date":"2026-02-28","category":"直播整理资料","reason":"文章为直播PPT、听译或全内容整理；与Steam直播预告或简要路线图为不同材料，不作为同篇公告对应。","date_review":"本轮按北京时间筛选发布前7天至发布后3天，共16条Steam候选。文章为直播PPT、听译或全内容整理；与Steam直播预告或简要路线图为不同材料，不作为同篇公告对应。","date_candidates":[{"id":"1825727806719498","date":"2026-03-03","title":"[Notice: The Index Nursefather Yi Sang Identity Growth Pack Sales Period Error]","url":"https://steamstore-a.akamaihd.net/news/externalpost/steam_community_announcements/1825727806719498"},{"id":"1825727806717017","date":"2026-03-02","title":"2026.03.05 (KST) The 8th Walpurgis Night Target Extraction","url":"https://steamstore-a.akamaihd.net/news/externalpost/steam_community_announcements/1825727806717017"},{"id":"1825727806717002","date":"2026-03-02","title":"2026, Mar. 5th Scheduled Update Notice","url":"https://steamstore-a.akamaihd.net/news/externalpost/steam_community_announcements/1825727806717002"},{"id":"1825727806716962","date":"2026-03-02","title":"New Event - The 8th Walpurgis Night","url":"https://steamstore-a.akamaihd.net/news/externalpost/steam_community_announcements/1825727806716962"},{"id":"1825727806710634","date":"2026-02-27","title":"Limbus Company 2026 H1 Roadmap Information","url":"https://steamstore-a.akamaihd.net/news/externalpost/steam_community_ w Content - Mirror of Names and Spiders Hard Difficulty","url":"https://steamstore-a.akamaihd.net/news/externalpost/steam_community_announcements/1825093633193434"},{"id":"1825093633193406","date":"2026-02-23","title":"New Content - 3rd Anniversary Event","url":"https://steamstore-a.akamaihd.net/news/externalpost/steam_community_announcements/1825093633193406"}],"body_text":"共计126页PPT内容，以下为60-126页的翻译。\n稍后将整理完成总监在PPT汇报结束后的主要口述内容的听译。\n本部分PPT翻译：茕明、安默、小车、5E、玉佩、Cupcake~\n本部分节选总监口述听译 & 小绿笔板书翻译：卷师\n*在下文中以\n绿色字体\n表示\n总监的口述内容，与用小绿笔所写的内容\n。\n目录\n60-70 人格皮肤\n71-74 LCB定期体检（复刻）\n75-77 间章9.5-1\n78-79 间章头目挑战模式\n80-81 深夜清扫（复刻）\n82-83 六号线\n84-92 E.G.O五破\n93-94 良秀赛季高光人格\n95-96 间章9.5-2\n97-100 2号线（复刻）\n101-102 瓦夜（图书馆来宾主题）\n103 第十章：凝视之下\n104-108 边狱自走棋（暂定）\n109 路线图总览\n110-120 今后的活动\n121 狂气x1300\n122-126 Part1汇报环节结束，即将转入Part2（及招聘信息）\n60-61\n人格皮肤\n（*进入人格皮肤演示视频）\n62-65\n只有达到同步阶段4的人格才能制作皮肤。\n每位罪人均可使用皮肤制作代币，将已有人格形象制成皮肤。\n皮肤制作代币可用纺锤和人格碎片进行兑换。\n使用对应人格的碎片，会使消耗的人格碎片数量减少。\n若使用其他罪人的人格碎片或纺锤，将消耗更多的人格碎片。\n装备皮肤\n不会改变原有人格的动画速度\n。\n演出效果将结合“原人格的动画速度”与“人格皮肤的外貌”进行呈现。\n对于部分人格的某些在满足特定条件时才会触发的强化演出，将\n不会\n进行对应动画的制作。\n由于存在该部分不足，将在制作皮肤时显示预先警告。\n后续改进后，计划增加形态变化与外观的同步呈现。\n66\n适用人格一览（变身型/联合型人格示例）\n示例\n-  脑叶公司E.G.O::以爱与憎之名 堂吉诃德\n- 脑叶公司E.G.O::泪锋之剑 罗佳\n- 食指 代行者 - 绽放E.G.O::代行 堂吉诃德\n- 狂猎 希斯克利夫\n- 黎明事务所 收尾人 辛克莱\n特别说明\n皮肤只会反映变身前的外观状态。\n身着皮肤时，变身前后将不会存在外观差别（可以通过状态效果图标进行区分）。\n67\n示例\n鸿园的君主 鸿璐   \n特别说明\n使用3-2技能时，将切换为单人攻击动画而非联合攻击动画。\n示例\n拇指 东部 指挥官IIII 默尔索 - 超绝猛虎杀击乱斩\n特别说明\n满足特定条件时的强化技能演出动画将不会播放。\n68-70\n“鸿园的君主 鸿璐”使用句点事务所代表皮肤时，与使用东部し协会皮肤的“黑兽-卯 魁首 浮士德”，进行鸿园的君主-黑兽连携攻击时的动画演示。\n演示视频中，人格使用3技能时的插画特写其实是错误的，应该应用皮肤人格的插画特写。\n变身效果并不适配。例如狐雨希斯克利夫皮肤没有狂猎骑乘杜拉罕的适配效果；Zwei罗佳皮肤也不会触发泪锋之剑插到自己身上的动画。诸如君主鸿璐的3技能连携攻击动画与拇指指挥官默尔索的猛虎标弹装填等动画也无法触发。\n71-74\nLCB定期体检 复刻\n人格x1\nE.G.O×1\n播报员×1\n（※ 本内容仍在开发中，实装时可能有所变动）\n75-77\n9.5-1 间章\n人格×2\n播报员×1\n（※ 本内容仍在开发中，实装时可能有所变动）\n对抗某根觊觎着蜘蛛巢遗产的手指的同时，\n与良秀和绮罗一起探索蜘蛛巢各处的故事。\n（另外还有探望格里高尔以及关于辛克莱的印记的检查）\n（※ 本图像仅供参考，实际更新时可能有所变动）\n某种程度上与间章“LCB定期体检”相似但又有所不同。这里没有给出过于明确的插画以及间章名称，是因为这样的话以后就不能再修改了。刚刚那一页本来是不该出现在这PPT里的，虽说我们有大纲，但具体的故事内容是可能有改动的。总之9.5-1的内容不一定是按着这页PPT来的。\n顺带一提，我现在给各部门的部长们开放了不少权限委以重任，而各位部长也给下属们委托了不少事项，总之这是个庞大的信任工程。\n目前9.5-1的内容交给了编剧来处理，我和主编正在着手准备第十章，所以我现在主要是负责验收以及制定第十章的主基调之类的。\n78-79\n间章相关头目挑战模式\n将在9.5-1间章实装后，间隔一段时间后更新。\n挑战9.5-1中登场头目的高难度版本。\n可能存在需要1个以上编队，或以特殊编队挑战更加有利的情况。\n今后的间章更新中，也会定期适配更新相应的头目挑战模式。\n（※ 本内容仍在开发中，实装时可能有所变动）\n有些人格在镜像迷宫里大放异彩，而有些人格则稍显逊色。我们希望能借此为后者提供一些发挥的空间。\n这个活动将会沿用间章中的BOSS，而非推出全新的BOSS。设计一个新的BOSS会占用许多时间，这将会影响到主线故事的进度。\n80-81\n深夜清扫 复刻\n人格×1\nE.G.O×1\n播报员×1\n（※ 本内容仍在开发中，实装时可能有所变动）\n82-83\n折射轨道6号线\n采用（韩国地铁6号线的）循环概念，希望让6号线在循环的过程中更加有趣（但不会像2号线一样需要重复通关）。\n增加了新的异想体战斗。\n准备加入在第8章和第9章中出现的各种头目。\n我们打算降低该活动本身机制的复杂程度，让玩家们能够更注重于战斗环节，更重视敌方单位的机制。让该活动的Boss Rush性质更为明显。\n84-87\nE.G.O异想解析 5阶段\n五月末的更新目标\n以优先为性能较低的E.G.O推出异想解析5阶段为方针。\n准备通过异想解析5阶段将E.G.O性能提升，并增加特效/演出。\n异想解析5阶段将从一部分E.G.O开始依次进行。\nE.G.O的实装跨度较长，且有等级之分。\n所以，罪人可能需要等待很久才能再次获得同等级/同关键词的E.G.O。\n因此，为了让各E.G.O能够长期使用，将通过开放异想解析5阶段以改善E.G.O的性能与外观。\n88\nE.G.O觉醒\n异想解析4阶段效果（12+8）\n硬币I：\n[命中时]\n使目标增加4级烧伤强度\n[正面命中时]\n使目标增加6级烧伤强度\n异想解析5阶段效果（16+8）\n主要目标每带有6级烧伤强度，使本技能的基础威力+1(最多+4)\n硬币I：\n[不可摧毁的硬币]\n[命中时]\n 使目标增加4级烧伤强度\n[未摧毁 - 正面命中时]\n 使目标增加6级烧伤强度\n（※ 以上为开发中画面，不代表最终品质）\n（※ 以上文本仅供参考，非最终定稿）\n89\nE.G.O侵蚀\n异想解析4阶段效果（24-12）\n[随机指定目标]\n硬币1：\n[命中时]\n使目标增加4级烧伤强度\n[正面命中时]\n使目标增加6级烧伤强度\n异想解析5阶段效果（24-12）\n[随机指定目标]\n使本技能造成的伤害+(主要目标的烧伤强度)%(最多+24%)\n主要目标每带有4级烧伤强度，使本技能的基础威力+1(最多+6)\n[攻击后]\n 下回合使自身获得\n燃烧\n(每回合最多1次)\n硬币I：\n[不可摧毁的硬币]\n[命中时]\n 使目标增加4级烧伤强度\n[未摧毁 - 命中时]\n 使目标增加6级烧伤强度\n（※ 以上为开发中画面，不代表最终品质）\n（※ 以上文本仅供参考，非最终定稿）\n（*译注：上文中的新状态效果的译名为暂定，实装后仍可能调整）\n90\nE.G.O被动\n异想解析4阶段效果\n拼点胜利时，使目标增加(暴怒完全共鸣数/2)级烧伤强度(每个技能最多1次)\n异想解析5阶段效果\n拼点胜利时，使目标增加(暴怒完全共鸣数/2)级烧伤强度(每个技能最多1次)\n若目标的烧伤强度不低于4级，则使自身的拼点威力+1\n（※ 以上为开发中画面，不代表最终品质）\n（※ 以上文本仅供参考，非最终定稿）\n91-92\n（动态效果演示）\n93-94\n高光人格\n（良秀）\n以过去/未来Buff为核心，通过本体与残像交替进行攻击\n与蜘蛛巢的父辈以及子辈同时编入队伍时，通过良秀的记忆来强化基于过去/未来Buff的攻击\n属于蜘蛛巢的友方单位可以替自身承担伤害。而友方单位死亡后，自身的过去/未来Buff将得到强化\n（※ 本内容仍在开发中，实装时可能有所变动）\n目前的设计理念是一款偏向个人秀的人格。我的要求是“随着同一编队中的蜘蛛巢父辈或子辈人格阵亡，良秀人格的残像会变得越来越多，最后可以独自接管整场战斗”。总之目前是这样。\n95-96\n9.5-2间章\n人格 x2\nE.G.O x1\n播报员 x1\n与LCD一起，一边狩猎扭曲一边前往N公司的故事。\n（※ 本图像仅供参考，实际更新时可能有所变动）\n还好这次文本概述比刚才9.5-1的时候要短一些。\n97-98\n折射轨道2号线 复刻\n等级上调至60级\n难度将提高\n（※ 本内容仍在开发中，实装时可能有所变动）\n99-100\n2号线将变为常驻内容。\n模式变化为每圈进行一轮连续战斗\n连续战斗关卡→选择Buff→连续战斗关卡→选择Buff……如此循环\n（连续战斗关卡→选择Buff→连续战斗）\n我们希望能消除需要反复通过同样关卡的不便体验。\n希望通过连续战斗关卡，能够让人格以及E.G.O的效果实现最大化。\n（※ 本内容仍在开发中，实装时可能有所变动）\n101-102\n瓦尔普吉斯之夜 废墟图书馆的来宾主题\n人格 x2\nE.G.O x1\n播报员：Binah（脑叶公司）\n根据情况，瓦尔普吉斯之夜的日程有可能提前。\n（※ 本内容仍在开发中，实装时可能有所变动）\n103\n第十章 凝视之下\n目标在8月中旬实装。\n104-108\n新增内容 - 边狱自走棋（暂定）\n目标为在今年内实装。\n是通过组合随机出现的人格、E.G.O与协同效果来构筑阵容，以产生有趣效果的模式。\n通过组合随机获得的人格产生协同效果\n通过为各个人格装备E.G.O来强化阵容\n通过随机触发的加成效果来强化阵容，或是组合适配加成效果的阵容\n人格将按照固定的模式自动进行战斗\n减少战斗时必须手动操作的压力\n可设置人格的战斗模式\n基本可以使用全部角色\n- 但已培养的角色可能可以发挥更为强大的功能\n（※ 本内容仍在开发中，实装时可能有所变动）\n希望能为玩腻了镜像迷宫的全收集玩家们带来一些新鲜的内容。我希望这个模式能够成为“镜像迷宫搬砖循环”的下一站。之前提到的UI皮肤也会被添加到这个模式的通行证奖励中。当然要是不想打游戏直接拿奖励的话，也可以有氪金直达通道。\n109\n2026上半年路线图总览\nMAJOR\n镜像迷宫\n瓦尔普吉斯之夜 琥珀色的黄昏\n人格皮肤\nLCB定期体检 复刻+但丁的笔记\n9.5-1间章\nX.5相关头目挑战\n深夜清扫 复刻\n折射轨道6号线\n异想解析阶段5\n高光人格\n9.5-2间章\n折射轨道2号线 复刻\n第10章 凝视之下\n边狱自走棋（暂定）\nMINOR\nUI外观选择功能\nUI/UX持续改善\n播报员选择栏/选择上限增加·播报员预设功能\n可拖拽更改编队顺序，视觉可见性改善\n可预设编队数量增加/采光连续战斗功能\n新增编队设定关键词（所属、泛用关键词）\n新增自定义战斗内SD角色效果展示UI（开/关）\n主线剧情语音文件清除功能/主页面BGM切换功能\n加载页面插图切换功能\n于放映室内增加图鉴\n110-111\n今后的活动\n现代百货快闪店\n边狱公司“地狱篇”展览会\n火腿嘭嘭 - 火腿嘭嘭主题\n与まねきねこ的联动\n火腿嘭嘭 - Sephirah主题\n粘土人以实玛利 预计开售\n月亮计划十周年音乐会\n昨天发生了许多事情，我对运营过程中的诸多过失向大家道歉。\n我们将从4月末起，在火腿嘭嘭售卖快闪活动同款的周边商品，并争取2026全年供货。另外5月份的\n火腿嘭嘭\nSephirah主题将会是最后一期废墟图书馆主题了，今后随着月亮计划10周年我们将会开办Limbus Company主题。\n我们打算参与C108，这样一来位于日本的用户们也能买到我们的周边了。\n东京游戏展（TGS）方面，我们还是会和以前一样，全员参与，且每人都能入住单人间酒店。\n112\n边狱公司3周年 - \n现代百货快闪店\n首尔：2/26~3/4 正在进行\n大邱：3/13~3/19 预计进行\n113\n边狱公司“地狱篇”展览会\n东京：3/6~4/6\n首尔：4/23~6/28\n大阪：5/8~6/8\n114\n火腿嘭嘭 - 火腿嘭嘭主题\n预计于3月中旬开始\n115-116\n与\n卡拉OK まねきねこ\n的联动\n边狱公司 x \n卡拉OK まねきねこ\n预计于4月中旬开始\n预计在日本、韩国进行\n117\n火腿嘭嘭 - Sephirah主题\nSephirah主题预计于5月中旬开始\n118\n粘土人以实玛利 预计开售\n（可爱！）\n119\n月亮计划十周年音乐会\n是涵盖脑叶公司、废墟图书馆以及边狱公司音乐的交响乐版本的音乐会。\n正以在年末举行为目标而准备中\n（11月16日）\n。\n120\n预计参加的活动\nTGS\n夏季C108\n目前我们正在讨论是否参加。\n确定参加后将会另行告知。\n121\n狂气x1300\n赠送对象：2026年3月5日09:00(CST)以前创建账号的全体玩家\n日期：2026年2月27日（周五）之后（每个账号限领1次）\n可在2026年3月5日（周五）09:00 store-a.akamaihd.net/news/externalpost/steam_community_announcements/1825727806710265"},{"id":"1825727806710191","date":"2026-02-27","title":"[Limbus Company] 3rd Anniversary PV","url":"https://steamstore-a.akamaihd.net/news/externalpost/steam_community_announcements/1825727806710191"},{"id":"1825727806710021","date":"2026-02-27","title":"Limbus Company 3rd Anniv. & Roadmap Livestream","url":"https://steamstore-a.akamaihd.net/news/externalpost/steam_community_announcements/1825727806710021"},{"id":"1825727806709864","date":"2026-02-27","title":"Notice: Cursed E.G.O Non-functionality Issue","url":"https://steamstore-a.akamaihd.net/news/externalpost/steam_community_announcements/1825727806709864"},{"id":"1825727806709565","date":"2026-02-27","title":"Notice: Hotfix for Cursed E.G.O Gifts Not Appearing","url":"https://steamstore-a.akamaihd.net/news/externalpost/steam_community_announcements/1825727806709565"},{"id":"1825727806706868","date":"2026-02-26","title":"Notice: Additional Improvements & Known Issues in Ver. 1.99.1, updated Feb. 26th","url":"https://steamstore-a.akamaihd.net/news/externalpost/steam_community_announcements/1825727806706868"},{"id":"1825727806704117","date":"2026-02-25","title":"Limbus Company 3rd Anniversary and Future Roadmap Livestream","url":"https://steamstore-a.akamaihd.net/news/externalpost/steam_community_announcements/1825727806704117"},{"id":"1825093633193457","date":"2026-02-23","title":"2026, Feb. 26th Scheduled Update Notice","url":"https://steamstore-a.akamaihd.net/news/externalpost/steam_community_announcements/1825093633193457"},{"id":"1825093633193434","date":"2026-02-23","title":"Feb. 26th New Content - Mirror of Names and Spiders Hard Difficulty","url":"https://steamstore-a.akamaihd.net/news/externalpost/steam_community_announcements/1825093633193434"},{"id":"1825093633193406","date":"2026-02-23","title":"New Content - 3rd Anniversary Event","url":"https://steamstore-a.akamaihd.net/news/externalpost/steam_community_announcements/1825093633193406"}],"body_text":"共计126页PPT内容，以下为1-59页的翻译。\n本部分PPT翻译：落星、玉佩、族长、茕明\n本部分节选总监口述听译 & 小绿笔板书翻译：卷师\n*在下文中以\n绿色字体\n表示\n总监的口述内容，与用小绿笔所写的内容\n。\n目录\n1-2 开场\n3-10 三周年纪念活动、日活与月活、户外广告\n11-12 路线图开始\n13-16 UI外观选择功能\n17-37 镜像迷宫7（平行叠加模式、成就系统、极限模式及相关改善）\n38-52 UI页面改善、其他内容的预计改善日程\n53-59 第8次瓦尔普吉斯之夜 - 琥珀色的黄昏\n1\n*直播设置\n稍等一下，不好意思\n2 \n今天的直播 → 第1、2部分\n第1部分 - 正式路线图\n第2部分 – 碎碎念（发疯）时间\n（*进入3周年纪念PV）\n3\n边狱公司3周年纪念及路线图直播\n今年也是月亮计划成立10周年。\n4\n3周年活动介绍\n5\n在3周年当天（2月26日23:00\n[CST]\n）后，活动期间（2月26日-3月26日）首次登录时，您可以获得一张3⭐人格必得券。\n6\n活动期间（2月26日-3月26日），您可以通过累计登录14天以获得下列奖励。\n- 提取券 x 8\n- 第1赛季人格自选券\n- 第2赛季人格自选券\n- 第3赛季人格自选券\n- 跳跃成长模组-人格同步\n- 跳跃成长模组-E.G.O解析\n[WAW]\n- 边狱公司3周年纪念特殊横幅\n- 3周年特别车票装饰\n- 安吉拉（图书馆馆长–初期）播报员\n- 3周年纪念人格自选券\n第1赛季人格自选想必是要选N辛的，第2赛季的话还有狐雨人格，至于第3赛季就得是高光人格船长以实玛利了。\n2月27日不仅是安吉拉的生日，同时也是脑叶公司正式发售的日期。所以这一天可谓是意义非凡。播报员的“初期”意味着以后还会有其他时期的版本。\n7\n每月活跃用户\n8\n每日活跃用户\n9-10\n户外广告展示\n我一直以来都很想要这样的户外广告来着。\n11-12\n2026上半年路线图\n根据开发状况，内容随时可能在没有事先通知的情况下改变。\n13-16\nUI外观选择功能\n2月26日（周四）更新了可以使用新增UI界面的功能（原本的UI界面也可以继续使用）。\n主题：关于边狱公司游戏整体外观的设定\n皮肤：部分适用于例如玩家名片等界面\n目标在今后增加更多的UI皮肤。\n17\n镜像迷宫\n以下内容将依次更新。\n- 平行叠加模式\n- 迷宫成就及奖励\n- 极限模式\n- 预计的便捷性优化\n- E.G.O饰品平衡性调整\n18\n关于镜像迷宫7的开发日程\n2月19日：镜像迷宫7 普通模式\n2月26日：镜像迷宫7 困难模式\n3月5日：镜像迷宫7 平行叠加模式（~10层）\n3月12日：平行叠加模式（~15层）/ 增加第一轮成就，及镜像迷宫通行证\n3~4月：第二、三轮成就 / 通行证扩展\n4月：新增隐藏头目 / 新增极限模式卡包 / 新增制约\n19-21\n不同步实装困难难度以及10层的理由：\n我们需要同时准备镜像迷宫7的新增E.G.O饰品及主题卡包、3周年活动、UI主题切换系统。\n我们判断需要确保10层开放后的稳定性，因此将其分批与成就系统一同更新。\n我们判断有必要快速开放高层数，因此决定先逐步开放10层与15层。\n大家可能会疑惑，为什么我们没有在开放困难难度的时候同时开放10层与15层。这主要是由于我们需要调整部分内容，同时我们还在推进UI项目，所以最后就对不上轴了，只能分批更新。\n我们以后会试着再加把劲，争取做到一口气开放10层。\n22\n平行叠加模式\n3月5日：开放10层\n3月12日：开放15层\n23-24\n成就系统\n预计于3月12日更新。\n（※ 本图像仅供参考，实际更新时可能有所变动）\n新增收集类/通关类的成就\n新增“名与蛛之镜”通行证\n预计此后依次增加成就以及扩展通行证\n这次的成就内容会与以往有所不同。\n25-27\n极限模式\n- 2026年3月12日\n开放至15层\n- 2026年4月：预定第二轮更新\n新增隐藏头目/隐藏头目饰品\n部分隐藏头目将变为极限模式专属头目\n隐藏头目变动时，现有的隐藏头目饰品也将有概率变化\n- 新增制约\n新增包含高难度制约的新制约。\n让玩家能够得到更强的E.G.O饰品，挑战更高的难度。\n（※ 本内容仍在开发中，实装时可能有所变动）\n某些原来的隐藏头目将会成为极限模式限定主题卡包中的指定关底BOSS。由于这意味着相应的\n头目\n将失去“隐藏”的属性，所以对应饰品的效果会有所不同；同时我们也会添加新的隐藏\n头目\n填补空缺。\n28\n即将到来的便利性改善\n下列更新会按顺序于4月30日前更新。\n29\nE.G.O饰品图鉴中，新增基于等级和关键词的筛选功能。\nE.G.O饰品合成中，添加“可合成”标记，并允许从列表直接合成。\n（※本内容仍在开发中，实装时可能有所变动）\n30\n可查阅主题卡包内出现的E.G.O饰品。\nE.G.O饰品强化，可选择指定强化阶段直接进行强化。\n（※本内容仍在开发中，实装时可能有所变动）\n31\n在卡包图鉴中标记可出现楼层。\n选择卡包时，会显示Boss的信息。\n（※本内容仍在开发中，实装时可能有所变动）\n32\n调整了选项事件的“跳过（Skip）”按钮位置。\n在镜像迷宫节点上，可通过键盘控制移动方向。\n33\n选择初始E.G.O饰品时，如果未选择最大数量的饰品，则会进行弹窗提示。\n可同时出售多个E.G.O饰品。\n34\n增加镜像迷宫内选项事件及战斗。\n现有的异想体战斗将添加选项事件。\n未来增加新异想体战斗时，对应的选项事件也会被添加进镜像迷宫。\n针对“有些异想体明明都有对应的战斗环节了，但这个异想体的选项事件中居然没有触发战斗的选项”的情况，我们将为符合以上条件的异想体添加可触发战斗并获取丰富奖励的事件选项。\n35-37\nE.G.O饰品的平衡性调整\n- 现状：\n因为镜像迷宫属于重复性游玩内容，因此饰品调整的周期很长。\n- 改善：\n间章、复刻的同时，都会定期进行饰品平衡性调整。\n比起在有限的范围内优化到最平衡，不如专注于扩展多样性。\n添加新E.G.O饰品，并扩展多样性。\n在普通卡包中添加泛用饰品。\n性能较低的饰品可以与新饰品和进行合成。\n现有的饰品也会进行调整。\n镜像迷宫的通关难度设计一直以来都是比较敏感的事项。有的玩家想要更有挑战性，而对于某些玩家来说这又是获取人格的重要途径。总之随着不断更新，可能导致某些饰品过于强力，并导致难度曲线崩坏。总之我有一阵子还挺害怕这件事的。\n所以我打算在每当间章更新或复刻时，对E.G.O饰品进行平衡调整。这并不意味着我要直接调整原有E.G.O饰品的数值。我的计划是添加更多新的饰品，还有就是新增一些能够使较为弱势的E.G.O饰品进行合成的强力饰品。总之我是想尽量避免改动现有的饰品，毕竟这样的话以后要同时考虑的事情也会越来越多。比起反复调整现有的饰品，还是添加一大堆新饰品更有意思。\n38-39\nUI/UX页面的持续改善\n更新将按顺序于6月前实装。\n我们计划每个季度都进行一次更新。\n在Limbus这个项目中，最重要的是故事的创作，其次是战斗环节的策划，所以导致UI/UX优化事项的优先级一直以来都不是很高。虽然我们也希望能够尽快完成，但是慢工出细活嘛。\n40\nUI/UX改善内容\n播报员插槽增加，并增加播报员预设功能。\n罪人的编队上限由20提升至40。\n姑且是给员工提出了最多可以设置100名播报员的目标。编队上限也是暂定提升到40，以后肯定还会进一步提高最大编队数量的。\n41\n将可以拖拽编队来改变编队顺序，提升可见性。\n将新增关键词（所属、泛用关键词）。\n42\n新增战斗中SD效果UI的自定义开关（On/Off）\n我们发现在镜像迷宫的后期流程中，由于拥有的饰品数量很多会导致回合开始时弹出大片大片的饰品名单一般的UI，有些玩家反馈不喜欢这样的UI。所以我们打算添加对应的UI开关。\n43-44\n改善与新增内容\n- 目标更新窗口：3月\n\"但丁的笔记”的新条目\n剧情创作流程将被改善，以便稳定持续更新\n（※本内容仍在开发中，实装时可能有所变动）\n但丁的笔记之前是在5章、6章、7章、8章之间更新的。其实但丁的笔记一开始是为了在赛季更新延后的情况下为玩家带来新的内容而由我本人亲自撰写的，可以说是早期风味文本了。但由于本次第9章的更新十分紧迫工作繁重，所以但丁的笔记就像假期作业一样被搁置了。\n今后但丁的笔记相关内容将由编剧部门接收，并专门进行系统化的管理——间章更新与复刻时，但丁的笔记将会在一周内保持每日更新。\n45\n目标更新窗口：4月\n进入采光时，将可以选择要挑战的次数。\n（※本内容仍在开发中，实装时可能有所变动）\n46\n采光最多可进行10次连续战斗。\n对于单波次敌人的战斗，10次连续战斗则为10波次。\n（※本图像仅供参考，实际更新时可能有所变动）\n最多设置10次连续战斗的意思，就是把原本10场战斗中的内容全部合并到1场连续战斗之中。\n这样的话大家就可以在中后期E.G.O连发战斗爽了。虽然确实是搬砖性质，但我还是希望大家可以在这过程中体验到长线战斗中\n连续作战的\n独特乐趣。\n47-48\n目标更新窗口：6月\n使玩家可对剧情中的语音资源进行下载、删除操作。\n能以主线章节、间章、迷你剧情（列于“驾驶席”中的剧情章节）为单位进行选择。\n在删除0-9章的所有语音后，将释放手机端约2GB的空间（PC端约4GB）。\n（※本内容仍在开发中，实装时可能有所变动）\n其实我们一开始就把这个功能提上日程了，但迟迟没有落实是因为，实际上配音文件的大小并不大，就算删掉也真的腾不出多少存储空间。所以虽然我们早就准备好了这个功能，但由于我们认为意义不大，所以迟迟没有实装。但我们毕竟先前承诺过了，所以不论如何都要兑现诺言。\n说起来，2D游戏占据的存储比3D游戏要更多一些。主要原因我以前也说明过，sprite小人动画其实会占据挺多存储空间的。另外就是我们一直都在赶工追求快速更新，所以也没怎么来得及优化。总之就是在速度和质量之间选择了速度，嗯……大家觉得这是借口其实也正常。\n先喝口美式再说。\n49-50\n将可以更换包含玻璃窗页面在内的大厅BGM。\n活动BGM可通过对应活动代币进行购买。\n更多音乐可在“BGM商店”中，使用特定货币进行购买。\n该货币可通过活动奖励等渠道获得。\n该货币预计也可通过纺锤兑换来获得。\n（※本内容仍在开发中，实装时可能有所变动）\n51\n目标更新窗口：7月\n加载界面背景将可由玩家选择。\n（※本内容仍在开发中，实装时可能有所变动）\n52\n目标更新窗口：8月\n将在放映室中，追加异想体与敌人的图鉴功能。\n（※本内容仍在开发中，实装时可能有所变动）\n为什么这么久了都没有图鉴呢？这个说来话长，我希望图鉴中的界面能与战斗中查询敌方情报的界面相同，同时包含对应单位的小人动画与情报文本界面。但是想在图鉴中实现这个目标的话需要调用所有敌方单位，而如果把所有小人动画以动画的形式导入也会比较麻烦，这个项目的工期莫名其妙地长，所以我想着要不直接做成档案搬文本之类的呢。总之这次是下定决心非要搞定图鉴不可了。\n53\n瓦尔普吉斯之夜 琥珀色的黄昏\n2026年3月5日(星期四)~3月19日(星期四)\n（*进入瓦夜8PV）\n54\n第8次瓦尔普吉斯之夜 琥珀色的黄昏\n镇压琥珀色的考验\n55\n脑叶公司E.G.O::余香·孤独 良秀\n56\n和声 辛克莱\n57\n脑叶公司E.G.O::黄蜂【变调】默尔索\n（*划掉“改造”，在正式PV中改成“变调”）\n关于【变调】E.G.O，这是可以切换形态的E.G.O装备，算是比较新奇的设定。其实早在脑叶公司时期就想实装这种机制了，只可惜当时技术受限。而且只有少数的几款E.G.O才能拥有独特的机制。直到今天，这个设想才变成了现实。\n58\n新增播报员 - Chesed（脑叶公司）\n59\n完成任务即可获得各种奖励：\n提取券\n狂气\n人格训练券III、IV\n纺锤\n自我碎片箱\n自我碎片自选箱\n特别横幅\n车票装饰","read_status":"已读取页面；图片内容按需局部核对，未全文校对","images":["http://i0.hdslb.com/bfs/new_dyn/d48c026411332af26df87cad8a42a5303632319835409017.png","http://i0.hdslb.com/bfs/new_dyn/cfd31d239f5f2c22e860063cd0bbc4573632319835409017.png","http://i0.hdslb.com/bfs/new_dyn/a37f3c188c5488a16dbf36f0f0f247723632319835409017.png","http://i0.hdslb.com/bfs/new_dyn/bc463c466c53d9bd23a98f47b4f13ba63632319835409017.png","http://i0.hdslb.com/bfs/new_dyn/56497146c76333f83962af532b5740003632319835409017.png","http://i0.hdslb.com/bfs/new_dyn/704183ce34d7c7395d2a9c4186d9eaba3632319835409017.png","http://i0.hdslb.com/bfs/new_dyn/ca37bbfd16d58524c761772eeea5d5223632319835409017.png","http://i0.hdslb.com/bfs/new_dyn/3f152cecbdb97f02b8f4ad2e8dd3584a3632319835409017.png","http://i0.hdslb.com/bfs/new_dyn/1572d7df77328c320b24b77f825bca253632319835409017.png 816637"},{"id":"1821922921815320","date":"2026-01-16","title":"2026.01.22 (KST) New Identity Target Extraction","url":"https://steamstore-a.akamaihd.net/news/externalpost/steam_community_announcements/1821922921815320"}],"body_text":"本文只为全面且准确转达直播内容。括号部分文本为总监的碎碎念（即直播中无文字记载内容）。非常感谢卷师的辛勤听译。希望大家看得开心。\n正文：\n本次直播并非路线图直播，仅为前瞻直播。\n第九章（某种程度上虽然还不够完美）还是挺成功的。\n所以我觉得开播应该也没问题？所以就开播了。\n到了正式直播的时候，我会准备好\nPPT\n的。\n后续我们的更新计划是“\n9.5-1\n间章，间章复刻，\n9.5-2\n间章，间章复刻，主线故事”。\n本次直播目标：\n1.      告知我们将在合适的时间进行路线图直播。\n2.      向各位员工传达优化事项与新的想法（开发组已经有55人啦）。\n3.      共享现状。\n还请注意，本次直播会显得有些业余，且较为社团向。这一点很重要，就算影响到了观感也没有别的办法。我要是不这么做的话就会没有动力，这会导致无法创作后续内容，所以直播要尽量轻松一点，不消耗精力、不构成负担。\n直播节奏会比较慢，看起来不是很爽。\n我觉得在这过程中或许也会突然想到精简的情报或产生想法。\n0. 对第九章有什么看法？\n（既有令人满意的部分也有令人遗憾的部分）虽然工作量非常大，但好在还是成功赶上了日程安排……出人意料的是这次并没有遇到致命性的崩溃与导致游戏卡死的问题。难度方面好像也没有什么问题，看起来大家都玩得挺开心。\n虽然并不是所有人都会同意我的观点，但游戏归根结底是得在规定时间内推出成品，所以有些不得不割舍的内容，也有一些绝对不能放弃的内容。拼尽全力的作品已被推出，我们将在未来弥补遗憾，往后毕竟还有十多年，还有挽回遗憾的机会。\n1. 路线图直播在什么时候？\n目前暂定为\n2\n月初，但也有可能会提前，目前并未确定日期。毕竟需要时间准备直播用的\nPPT\n，但我需要考虑一下用于准备直播\nPPT\n或脚本的这份动力要不要用在游戏开发这方面。\n所以\n2\n月初应该就可以了？（设计部门，如果各位在看的话，希望你们了解这个情况）\n在讲述现状之前，我想讲点别的事情。\n2. 要添加什么新的内容？\n- \n我们计划于在\nlimbus company\n三周年纪念时，为游戏添加皮肤系统。就像之前说过的那样，将原本的人格套用于新的人格，让玩家可以尽情观赏性能不足的人格的造型与语音，但这将会伴随某些货币与条件，有关该功能的具体事项将会在敲定后再告知大家，但大概需要满足人格同步第\n4\n阶段并消耗纺锤或自我碎片以及人格皮肤转化专用货币等资源，或许人格皮肤转化专用货币还可以用纺锤或自我碎片兑换？这一点还需要在企划部门内部讨论一下。\n1.\n将原本的人格转化为皮肤也会有一些例外，例如魔王希斯克利夫与君主鸿璐，前者有上下马的动作，而后者则与黑兽有许多互动，这些人格应用皮肤时需要更多特殊处理，虽然总有一天能做到但是\n3\n周年更新皮肤功能时可能还无法推出。会存在一些限制。\n接下来要说的不是\n3\n周年时的事情，皮肤系统实装后我们还打算推出全新的皮肤（不再是新人格套上旧人格），这些皮肤是包含小人与立绘画像的全新形象。毕竟像是睡衣或者便服之类概念的服饰难以通过人格的形式推出，但是又想看到喜爱的角色们漂亮的立绘或动作之类的，所以这些内容也算是皮肤项目的目标。我们打算让这种皮肤具备立绘（不分三破前后）、小人图像、语音、动画等内容。\n可获取途径会比较多样化。\n通过赠送、活动奖励、通行证内容等多种途径发放。加入组合包中售卖或是使用狂气购买。开卡池或者将其加入提取列表中，也算是为了挣钱嘛。我们会在抽卡获取的皮肤上投入更多心血，这当然不意味着我们赠送的皮肤是粗制滥造的。目前活动奖励中名片装饰占大头，我觉得需要更加强力的动机，如果奖励皮肤的话玩家会不会更满意？\n但我不打算将其作为镜像迷宫的奖励，而是作为新模式的奖励。\n哇还有新模式？！！！\n其实还是处于构思阶段，目前我已经与几名构筑部的人员大概讲述了一下。\n其实我今天的日程里有和程序部、企划部、构筑部开会讨论“该开发怎样的新模式？”的安排，所以我跟他们说我今天要直播发布干脆看直播吧。\n接下来的时间里，我将为各位员工与玩家讲述“我想要什么？”并确定初期方向。\n（思维有些枯竭了）我还是想到什么就说什么吧。\n新模式的目标定位是除了镜像迷宫以外的可玩内容。\n集齐人格之后才可以挑战的新模式，可反复游玩的肉鸽模式，这次一定要做出……货真价实的肉鸽……\n要想在镜像迷宫中做一些有关新模式或难度调整相关的尝试的话，镜像迷宫的体量已经太大了，如果想做一些更有趣的新鲜尝试，就需要大量试错与调整，镜像迷宫已经是某种矿山了。让镜像迷宫有意思是很重要，但是镜像迷宫本身已经处于某种为了获得奖励而存在的工位一般的状态，毕竟我们月亮计划也要谋求生计，所以我们并不打算将镜像迷宫模式的游玩时长优化或调整到现如今普通或困难模式中通关第五层的平均时长之内，而是继续保持惯性使其维持目前的游玩时长。镜像迷宫将趋于保守。\n如果有人主要通过抽卡获得人格，所以就算打完镜像迷宫也没有可获取的人格的话，镜像迷宫的游玩奖励对这个人完全没有任何吸引力，从而产生“别人都通过镜像迷宫的奖励兑换人格，只有我是纯粹因为好玩而玩的话总感觉哪里吃亏了”的心理……所以单纯以乐趣游玩镜像迷宫……\n还请大家冷静。\n我们不会改动镜像迷宫。各位现在游玩获得的奖励之类的内容都将保持不变。\n所以新模式的定位就是让游玩镜像迷宫获取人格之后不知道该干什么的玩家们游玩的模式。也就是人格池足够丰富才会变得更有意思的模式。\n企划部的各位请注意，以下是我的要求事项：\n0.\n我希望这是一种适合人们“在家里不知道该干什么时”能够开启\nlimbus company\n游玩的模式。我在家里偶尔也会觉得游戏之类的会没有意思，就算想着玩一会儿\nlimbus company\n，虽然对我来说镜像迷宫也别有一番乐趣，但又缺乏一些“跌宕起伏”，如果让镜像迷宫“跌宕起伏”的话肯定是要出事的。所以我希望这是种类似于\nSteam\n上肉鸽类游戏的模式，让人在无聊时想要玩上一两把，但又不是重度肉鸽的适合居家游玩的模式。适合“我通过抽卡集齐角色并在镜像迷宫里全场游龙但多巴胺给我带来的愉悦还是不太够”的玩家，并让玩家能够通过名为镜像迷宫的这座矿山所获得的资源扩充人格池与\nE.G.O\n池的状态下进行挑战的肉鸽模式。\n1. 人格池足够丰富才会变得更有意思的模式。应该还有人记得第一赛季的镜像迷宫吧，我想要的是那种一开始只以1到2个人格起步并逐渐构筑阵容的乐趣。就是那种在游玩过程中得到1个体系的人格就会让人觉得“哦，摇到这个人格了啊，我该考虑改变一下卡组或队伍的构筑方向了”之类的那种，自走棋类型的。给出5个人格，从中挑选1个并转到下一环节，以这种方式逐步构筑阵容的模式会比较好。\n2. 战斗方式一定要轻松，哪怕是P一下也不行，干脆就要自动战斗！所以我觉得需要在战略方面做出一些分化，例如人格构筑过程中有2个1技能，但能够随着游玩逐渐获取2技能与3技能。\n人格使用技能的顺序可被设定。例如设定为先使用\n1\n技能再使用\n2\n技能，这样只要我设定好阵容之后角色就会自动战斗了。\n每个人格使用技能的顺序由玩家决定。例如“以\n3\n技能\n-1\n技能\n-2\n技能的优先级使用技能”或是“按照\n1-2-1-2-1-3\n的顺序循环释放技能”\n没有类似原本“回合”的设定，可以一直丝滑地战斗下去。\n那么玩家要在什么时候介入什么操作？\n使用\nE.G.O\n，在实时战斗的过程中，暂时慢放并由玩家释放\nE.G.O\n介入战斗。除此之外没有其他需要操作的部分，只要观看就够了。\n要有战斗开始前构筑队伍的乐趣。构筑队伍有随机性，走运的时候能凑齐君主鸿璐黑兽队，不走运的话就可能让尤莉浮士德、流浪乐队辛克莱、\nzwei\n罗佳组成一个队伍并在游玩过程中让人觉得“完了，这下怎么办”，然后突然在下一关摇到魁首卯浮士德，然后玩家就“太好了，就该是这样啊，该组黑兽队了”，或者摇到了炎拳格里高尔就转型烧伤队。\n可以使用\nE.G.O\n饰品，但是可获取的\nE.G.O\n饰品数量要少于镜像迷宫，提高每一个\nE.G.O\n饰品的重要性。\n如果镜像迷宫的乐趣是看结算界面的话（我能不能在这里聊其他游戏啊……），总之就是看爆炸输出大数字之类的乐趣啊。\n新的模式是在（黑暗的地下监狱里）步步向前的那种感觉，要让通关变成一种了不起的成就，并让中道崩殂成为一种常态。\n实际上镜像迷宫\n5\n层通关已经变成了一件理所当然的事情了，如果让玩家镜像迷宫打不过第\n5\n层的话，肯定会被骂惨的。本来现状就是游玩镜像迷宫是为了获得通关奖励，只有通关才能领到所有奖励，无法通关的话会让人很不高兴。\n新的模式采用类似于通行证的方式，不会由于玩家通关而给予大量的通行证经验值，而是基于战斗的次数获得相应的经验值，通行证有等级上限，只要通行证满级就相当于已充分游玩本赛季内容。镜像迷宫就跟呼吸一样平常，希望这次不论如何都能做出又新又有趣的内容。\n总而言之，\n逐渐获得人格并构筑队伍、\n编队时可以设定技能释放顺序、\n进入战斗环节后，无回合制自动战斗、\n只可通过使用\nE.G.O\n介入战斗。\n3. 可能有人认为“获得低强度人格”是一件坏事，但我认为即使没有特定的人格（例如君主鸿璐），也可以让该人格出现在新模式中。或是实际上所有未获取人格都可能出现在该模式中。那么通过镜像迷宫获取人格的好处体现在哪里？以君主鸿璐为例，我们可以让玩家在拥有该人格且实现人格\n4\n阶段同步时，让君主鸿璐在该模式中可以使用\n3\n技能或是提高其强度。所以要让全收集以及高同步在该模式中为玩家提供好处。并将该模式的默认难度对标全收集游玩体验，并随着人格同步阶段提供优势但不要让数值过于膨胀，总之要让提高同步阶段有意义。我不打算让人格等级干涉这个模式，毕竟人格全收集再加上高等级养成要求会让玩家觉得我神志不清或者是觉得我们想要推销经验券组合包了。更何况要想游玩镜像迷宫就必须得提高人格等级。\n新模式中主要依靠人格获取与否、同步化阶段、\nE.G.O\n异想解析阶段。未拥有的\nE.G.O\n也会在游玩过程中登场，但会有所削弱，相反如果是异想解析阶段较高的\nE.G.O\n则会更为强力。我想以这种方式进行平衡。（喝点水）\n4. \n那么关卡是怎么进行下去的？镜像迷宫中只需要点击下一个节点就可以向前推进，我打算让这个模式更加贴近地牢的设计。每次游玩时都会生成一个地图。大致如下：\n在非出口支路中会有丰厚的战利品，但是如果战败将导致游戏结束。\n想要地牢式肉鸽游戏模式。\n——先说这么多，如果企划部有疑问的话可以在群聊里说一声。\n基于我说的内容思考一下。会好玩吧？会好玩的吧？同意吗？会好玩的吧？想玩吧？\nAgree.\n企划部发了一个上吊表情包，看起来还是蛮喜欢的嘛。开心捏。\n（然后我该说什么呢）\n5.\n这个新模式什么时候推出？哈……我也不知道……现在得拟定一下日期了，我觉得比起长期准备之后再推出新模式，不如先以\nBETA\n的形式推出初期版本并逐渐改善。附带一个该模式专属的通行证，\nBETA\n阶段较短，奖励内容也一般。\n6. 新模式叫什么名字？总之还是个迷宫……就先叫他“limbus dungeon”吧。这只是暂定的名称。\n现状共享：\n现在我有点精疲力竭了。\n现在得构思\n9.5-1/9.5-2\n还有第十章。\n好在我已经大致想好了第十章到底该怎么处理才会好玩。\n前进的动力？有点不好搞定。\n最近我一直在苦恼。即使是在公司里也会心不在焉。\n就算想要拼搏一下也有点迷茫。\n但就算因此而去旅游心里感觉也会过意不去。\n要不要歇一周呢……要不要关掉\ndiscord\n给自己解压一下呢？为了以防万一还是在国内待着？这么做会有好转么……\n我说这段话还有一个理由。\n第九章创作过程中我将许多实际性的事务交给了各位部长，就连项目管理也交给了他们，这次做得实在是太好了，我在想再多把一些事情交给部长们然后自己暂时消失，他们是不是也能做得很好？\n总之需要一些对策啊。不管是在间章还是人格方面，总得有些“试试这么做吧，请添加这种内容吧，这样应该会有趣”之类的点子才行。我再不济也得像这次往第九章里写一堆风味文本才行，但我感觉现在写不出当时那样的文本了。\n唉。\n4\n月\n1\n日的愚人节也得好好准备。\n2\n月\n27\n日的三周年也得做些什么。\n还有线下快闪活动。\n今年还想参加东京游戏展和\nAGF。\n但是好累……\n总之情况就是这样。\n下次\n2\n月初或2月中旬直播的时候，希望到时候这种情况能够在某种程度上得到解决。希望到时候能以清爽且充满活力的状态与大家见面。\n总而言之第九章的反响很不错实在是太好了……\n而且我觉得月亮计划的各位部长和员工比以前成长了许多，就是除了硬实力这方面以外，合作交流、融入群体、有责任感、态度积极，也更有参与感。我想这也是第九章如此出色的原因。虽然日程安排非常艰难，但是我觉得充满了动力，能够更加依靠团队真的很好。\n所以我希望月亮计划最终能够达到的运营状态，就是我上述的那种程度。我希望月亮计划是一个我只需要说“要是有这种内容就好了，帮我做一个出来吧”然后我们只需要用眼神交流相互点点头就能让项目落实的“魔法箱子”。\n我希望自己能够专注于故事的构思、主题、类型、叙事以及其发展，高光时刻该如何处理之类的事务，就算风味文本由我本人亲自创作，也能专注于大方向方面的事情。而我也感觉我们正在向那个方向发展。实在是太好了……\n（今天直播的目标是什么来着）\n虽然我每次都在说这话，但我们要细水长流\n10\n年、\n20\n年……\n啊，啊。\n我想起来了。还有一些想说的事情。\n虽然并没有确定，但我觉得也可以这么做？\n我原本不是打算双线开发\nlimbus company\n和另一款游戏来着嘛？\n但是现在光是\nlimbus company\n就很不容易了，而我也想专注于这个游戏。\n在我看来，即使现在\n3D\n图像技术有所发展，对于\n2D\n图像与画风的需求与其阅读的浪漫将会依旧存续。\n所以我觉得可以弄一个\nlimbus company\n客户端，然后就像补充模组一样把其他游戏塞进去。例如我们可以运用\nlimbus company\n式的战斗或故事背景，创作扭曲侦探的支线外传内容，然后可以让战斗方式有些区别，或是在故事情节的过往画面中像冒险游戏一样通过点击互动收集证据与线索之类的，这样就可以在\nlimbus company\n上以模组的方式持续扩充外传游戏了。\n这样有很多好处：可以继续使用我们熟悉的开发工具与客户端进行开发。既可以保证\nlimbus company\n的开发，也可以着手于新游戏的开发。\n但是\n3D\n游戏也不是不可以，真让人烦恼……\n有一种身处岔路口的感觉……我想等到\n2027\n年冬天我们的办公楼竣工的时候，或许就能下定决心了吧。\n总之我创立并运营名为月亮计划的公司，是为了创作我想创作并讲述的故事，并将其以有趣的方式不断进行商业化供给，然后看着人们的反应感到自豪，感受多巴胺带来的快乐，自尊需求，名利双收。公司作为讲述并解析故事的平台，如果能以\nlimbus company\n一路坚持下去的话，倒是也不错？\n毕竟我不是技术型\nCEO\n，没有那种技术性的成就或相关的远大目标。但是我对开发用于实现我想表达的内容的技术还是挺在意的，这好像是叫技术性负债来着。为了让\nlimbus company\n比现在还不容易出问题并处于更稳定的状态，我打算在这方面多用心多投资一下。比起说是建立\n3D\n部门并管理项目进行各种尝试，更像是汤饭、猪蹄、鳗鱼料理店\nunagi-dong\n从来不换酱料一样，以同一种酱料代代延续并不断补充，就跟万年汤或终生汤一样。\nlimbus company\n也是某种终生汤，这里以\nlimbus company\n的旅程为主，然后会有一些扭曲侦探的外传，或是干脆由其他角色作为主角的插曲。说实在的以我们\nlimbus company\n现在的\nSD\n资源应该也可以制作横版动作游戏了。所以如果可行的话就能在\nlimbus company\n客户端里推出“Девять（\n9\n协会）收尾人的孤军奋斗，郊区送货流浪记”之类的\n2D\n横版动作游戏？要不就是文字类游戏，以文字类养成游戏的形式开发一款“出生于\n23\n区的我成为了\nseven\n协会的部长，变成了二老板，一会儿又成了都市之星，还突然变成了特色收尾人？！”的游戏，许多以\n2D\n为基础的游戏统统加到客户端里是不是也可以？\n画面又该怎么安排？有些想要从月亮计划世界观中释放出来的主旨以及对应的方向性，但是该如何表达这些内容？通过\n3D\n肯定能做到很多事情，但是需要的时间实在是太长而且风险也很大。更稳妥一点的话，应该添加过场动画，这样只通过\nlimbus company\n也可以展现都市的方方面面了吧。\n当然，外传游戏可能会存在一些付费内容。有可能是单独买断制的内容，也有可能是免费游玩但内含装扮或卡池之类的内购内容，又或许是通过\nlimbus company\n的提取以\n0.001%\n的概率获得扭曲侦探游戏第一部、第二部、第三部之类的，没保底。然后顺序也一团糟。\n这样简直赚翻了啊。开玩笑的啦。\n现在已经收到了来自全世界的厚爱了。我不能过于骄傲自满，要继续以组织社团式小型工作室的心态，继续创作精彩的内容。\n那么直播就到此为止了哦？\n我想通过直播向大家讲述的内容好像都讲完了。\n总之不管现在有多么劳累，都有活法啊\n~\n不管再累，就算会放慢步伐，也要举步艰难地走下去。\n加油！\n再见！\n谢谢！\n我们下次再见。（卖萌）","read_status":"已读取页面；图片内容按需局部核对，未全文校对","images":["http://i0.hdslb.com/bfs/new_dyn/320e082ae70215a52bb47739cccbeedf3632319835409017.png"]},{"article_id":43486110,"title":"6.5 WARP快车谋杀案 间章复刻 - 汉化更新 v2025102401","url":"https://www.bilibili.com/opus/1127517520404676674","published_date":"2025-10-25","category":"社区汉化资料","reason":"标题明确属于零协会汉化模组或社区自身公告；作为中文补充资料 口译：郑卷儿\n*共计100页PPT内容，以下为31-64页PPT的文本翻译\n31\n明日方舟联动\n32\n新增1位播报员、4个E.G.O（完全限定）\n33\n详细内容将在联动开始前正式预告。\n34\n6.5-2 WARP快车谋杀案 间章复刻\n35\n新增播报员：WARP列车广播\n新增的人格+E.G.O共两个\n（未定，可能是1人格+1E.G.O，可能是2个人格，可能是2个E.G.O）\n36\nMili音乐会：One Million Moons\n预定日期：2025年11月8日周六17:00(韩国时间) 16:00(北京时间)\n时长：70分钟\n地点：世宗大学 大洋厅（暂定）\n37\n火腿砰砰 Mili主题 将在漆黑噤默&残响乐团2主题结束后，于10月末开始。\n火腿砰砰 Mili主题 将持续2个月左右。\n38\n期间可以购买 Mili印象菜单、火腿砰砰 x Mili联动周边、Mili演唱会周边等\n39-40\n演唱会前第一次周边：火腿砰砰xMili联动周边，预计将制作实用型餐具\n演唱会前第二次周边：Mili演唱会周边、Mili吉祥物、月亮计划角色联动等各种周边\n41\n瓦尔普吉斯之夜 图书馆来宾主题\n42\n月亮计划9周年 周年庆\n等到9周年时，可能不会像现在这样有这么多新东西能讲了。\n43\n也许没别的重大新闻了……吧……\n44\n折射轨道1号线 复刻\n45\n1号线等级调整、1号线改为常驻\n46\n第九章 预定12月中旬更新\n临时暂定标题翻译：无割舍者\n（*关于主线章节标题的翻译：在早期的主线1-4章，届时的翻译仍对英文原文参照甚多，因而当时在未偏离日文、韩文的基础上，结合了英文具有而日文、韩文未完全采用的句型定式。从第5章开始，英文弃用了这一句型定式，同时随着不少韩文译者老师们的加入，翻译方针也日渐优先参照韩文原文。）\n（*在本次第9章，英文原文重新采用了早期的句型定式，但这一定式在韩文中并未完全严格采用。例如被给出中文译名的章节标题不思观望（바라볼 수밖에 없는 / The Surrendered Witnessing），与无作为者（마주하지 않는 / The Unconfronting）的韩文否定后缀一致，但英文并没有采用相同的句型定式。）\n（*最终目前由于英文、韩文都采用了类似的否定句型，而临时暂定同样在翻译中沿用这一句型。然而由于不思观望的韩文原文之例，由于韩文并未完全采用这一句型，且采用方式也与英文并不相同，因而后续仍有可能在优先参照韩文的前提下修改翻译。在看到第九章的前瞻图、或第九章实装时，都有可能根据前瞻内容或实际内容修改翻译。现版仅为临时暂定。）\n47-48\n为了在今年内更新第九章，以及由于明日方舟联动规模与间章相同，将跳过8.5-2间章与新折射轨道。\n如果今年内无法更新第九章的话，将追加更新8.5-2间章和新折射轨道。\n如果感觉拼尽全力今年内也赶不完主线，就把删减内容补上\n因为已经发过好几次跳票公告，这次实在不敢打包票\n49\n同时，会持续更新游戏的体验优化\n50\n编队UI改善、改进敌人机制的直观性、难度调整、“继续”功能等体验优化\n在鏖战雷横的过程中，深深意识到了改善机制的重要性。\n51-52\n编队UI改善\n53-54\n敌人机制直观性改善：将在被动技能详情板块中，将机制分为三档重要度显示\n在敌方信息中，也将机制执行优先级高的技能分为三档显示\n会说明“拼赢这个技能很重要”\n55-56\n预计增加消费狂气，不改变敌人状态的情况下立刻复活罪人的“继续”选项功能\n消费狂气以使用“继续”功能并通关的关卡，若该关卡在未来被削弱，预计将全额返还消费的狂气\n消费狂气所通关的关卡，预计不会算作EX通关（未满足EX条件）\n57\n人格皮肤系统：允许玩家使用较弱但深受喜爱人格的语音/待机动作/立绘\n进展不顺——比预期花费的时间更多\n58\n游戏文件容量的减小与优化\n59-60\n为什么这个游戏文件这么大？\n语音占据了很大一部分文件容量。但是，战斗资源基于动画，连续加载多个2D Sprite。这意味着，文件大小的增长可能比其他主要使用Spine动画或基于3D动画的游戏更快。\n总之还是战斗动画占用的存储也很多。\n我们暂时不准备因为这个问题而改变发展方向；我们会尝试在当前的办法下，用最合适的方式减小文件大小并优化游戏。\n61-62\n[比镜像迷宫更有效果、更有性价比的其他长期内容构想]\n- 鼓励玩家收集更多人格/E.G.O\n- 通关镜像迷宫+抽取人格+E.G.O挑战困难内容；比折射轨道持续时间更久\n63-64\n[比镜像迷宫更有效果、更有性价比的其他长期内容构想]\n- 像原先预想中的骰子棋盘+肉鸽玩法？\n- 逐渐更新E. 之间会有编队ui改善。\n11\n编队UI改善\n※ 本页面仅供参考。实际更新时有概率出现改动。\n12\n新增人格\n该人格会与东部Cinq协会小堂人格一起来。\n13\n那是……我们炎拳事务所的制服。\n14\n保持特定人格的休息奖励\n下次选取的人格是“推荐人格 / 活动人格”时，特定期间的休息奖励将不会消耗。\n15\n火腿砰砰扩建在4月1日结束，\n装了个好大一个led灯。\n又找了五六个新社员。\n想要努力让自己能管理更多的人，\n找到了一百个以上就可以做3d对战了。\n16\n最后，再次阿里嘎多，感谢大家。\n彩蛋1：\n在下面这张图中，\n这个是“8”\n这个是“9”\n这个是“大\n规模（규모）\n”，但写得稍微有点像“大\n仇甫（구보）\n”\n彩蛋2：\n*在总监十层镜像迷宫的过程中，02:07:50处，拉·曼却领嘉年华的男声演唱：\n总监十层镜像迷宫的录播：","read_status":"已读取页面；图片内容按需局部核对，未全文校对","images":["https://i0.hdslb.com/bfs/new_dyn/4310d6171a6ef95ad67fa86d498d4bc31247764479.png","https://i0.hdslb.com/bfs/new_dyn/82e2fb9e1d0ea9b9028695674f4e2dc71247764479.png","https://i0.hdslb.com/bfs/new_dyn/3a3f470d5cca03281a67a96987da2fee1247764479.png","https://i0.hdslb.com/bfs/new_dyn/cdedfadd7deb2ae8151cd64615b629901247764479.png","https://i0.hdslb.com/bfs/new_dyn/bd2678fad0c3870e2d5431ff9147582e1247764479.png","https://i0.hdslb.com/bfs/new_dyn/94fe21476afa2d75b8098e3dfd9b14491247764479.png","https://i0.hdslb.com/bfs/new_dyn/82145742b2bb610ff7fb51a8d424e0ea1247764479.png","https://i0.hdslb.com/bfs/new_dyn/036eb9e0924d2597046314724ff2e6bb1247764479.png","https://i0.hdslb.com/bfs/new_dyn/6e1b0d048251efefb84394858d71e01d1247764479.png","https://i0.hdslb.com/bfs/new_dyn/5d62885bc32c3f8ffb3e641b5e7ee7c91247764479.png","https://i0.hdslb.com/bfs/new_dyn/11734647a83310ba9361923e7bfaae861247764479.png","https://i0.hdslb.com/bfs/new_dyn/8e6a88d6bb461f873cd0469be9e33bd11247764479.png","https://i0.hdslb.com/bfs/new_dyn/a9baaa38b585cfd73e03f382782c339f1247764479.png","https://i0.hdslb.com/bfs/new_dyn/0f8675ecd42917ea3533987f4240791e1247764479.png","https://i0.hdslb.com/bfs/new_dyn/73e7faa2c9fc3ee231eeb86a77f5c8cd1247764479.png","https://i0.hdslb.com/bfs/new_dyn/94e27910caa62d7140518239e83eecef1247764479.png","https://i0.hdslb.com/bfs/new_dyn/a193c69061c656ad8159bfac6cbd3c211247764479.png","https://i0.hdslb.com/bfs/new_dyn/32a77e4462a69a49cff03fbd2de308441247764479.png","https://i0.hdslb.com/bfs/new_dyn/f599c4b1683e5b97481da135b0ca00fb1247764479. e":"Oct. 5th Scheduled Update Notice","url":"https://steamstore-a.akamaihd.net/news/externalpost/steam_community_announcements/5220291886501001903"},{"id":"5220291886490109728","date":"2023-09-29","title":"2023.10.05 (KST) New E.G.O Target Extraction","url":"https://steamstore-a.akamaihd.net/news/externalpost/steam_community_announcements/5220291886490109728"}],"body_text":"1/3\n大家好。\n我是月亮计划——火腿彭彭的店长宋明善。\n我们打算对目前正通过社区扩散的谣言与争议\n进行整理并写下引言。\n在此之前，由于无法消除读者的所有疑惑，还请谅解。\n首先，火腿彭彭一直在每一个主题中致力于\n通过餐饮、周边、环境、服务等多种元素满足顾客的需求。\n而店长与店员们也会在每日的营业结束后\n通过各种媒体与社区观察顾客们的反应，\n然后进行了很多会议。\n由于无法对社区中顾客们的个人意见及时进行一对一的反馈，\n并且只能在耗费时间紧密关注所有相关事项后\n再进行统一的反馈，对此我们再一次请求谅解。\n火腿彭彭为了能给予喜爱我司的游戏与商场的顾客们\n更多的喜悦而存在。\n而我们的所有员工也心怀着对顾客们的感激之情\n与对公司的爱心工作在岗位上。\n但是我们还是想小心翼翼地提醒大家，\n由于月亮计划与火腿彭彭的造谣，我们正受到\n大量的精神伤害。\n所以我们想通过这次公告，讲述以下的两个事项。\n1.    火腿彭彭的公告\n2.    火腿彭彭与TGS\n2/3\n1.    火腿彭彭的公告\n火腿彭彭的主题（主题周边&主题菜单）通知以外的通知\n今后将会明确标出责任人与创建人。\n主题、周边、菜单的制定\n会经过多次会议并由代表人最终确认，\n但与商场运营相关的部分与此外的\n火腿彭彭的公告内容将会在店长的判断下直接创建。\n（现在您正在阅读的公告也是如此）\n该事项的决定流程如下。\n首先是店长提议。\n然后集中了员工们的意见。\n接下来向代表人发出了提案。\n最后在长时间的内部讨论中通过了该提议。\n店长打算公开公告创建人的最终目的\n是为了防止我司与火腿彭彭相关的谣言四起。\n此外也是为了进一步保障火腿彭彭员工们的安全。\n所以希望人们能够停止由于尚未明确的臆测与造谣而对\n我司与火腿彭彭的网络暴力与线上&线下的攻击。\n（这段话不限于特定的SNS、社区、性别，\n并且在严密检讨过去的所有过程后写下）\n再次声明，相关的公告创建是仅属于作为火腿彭彭劳动者代表人——店长\n的权限，请停止无端臆测与大量造谣。\n火腿彭彭的员工们将会为了最高的质量与最优的服务\n时时刻刻一起竭尽全力。\n3/3\n1.    火腿彭彭与TGS\n火腿彭彭员工们一同参加了此次TGS的日程。\n对此，我们打算简述三个理由。\n首先\n与火腿彭彭相同，在大量人员来往的场合\n保持井然有序十分重要。\n而在TGS中将会迎来大量的人群。\n所以为顾客们尽力提供方便的娱乐体验\n并避免发生事故，需要提供现场指引。\n我们带着这项任务参与TGS，并顺利进行了活动。\n第二\n火腿彭彭是特殊的商场。\n我们需要根据主题的变换，\n研究并开发新的餐饮、周边、装潢等各种元素。\n我们认为火腿彭彭并不是只需要做好料理\n或者只能购买周边的商场。\n而参与这种世界性的游戏展对于我们的员工\n是一次开拓视野的好机会，所以参与了TGS。\n第三\n在TGS中可以进行全球性的多样化事物会谈。\n火腿彭彭为了能够更好的满足顾客们的需求，\n多年间也在逐步成长。\n为了进一步的发展，了解与游戏产业相关的全球企业并与其沟通。\n我们参与了TGS。\n此外火腿彭彭的员工们参加TGS\n是通过月亮计划提供的机票与酒店的援助才得以实现的。\n所以我们也为了进一步发挥火腿彭彭的作用，\n以及商场的进一步发展而参与了TGS。\n火腿彭彭的员工们将会为了最高的质量与最优的服务\n时时刻刻一起竭尽全力。\n今后还请各位来宾多多关照。\n谢谢。","read_status":"已读取页面；图片内容按需局部核对，未全文校对","images":["https://i0.hdslb.com/bfs/article/68ed8dd3c22318b40e6aedfb24703bc31247764479.jpg","https://i0.hdslb.com/bfs/article/a71fc57a03d6a542e0577c0c315508bc1247764479.jpg","https://i0.hdslb.com/bfs/article/b182a39ccc50bb4eee7a02f2c49e9ecc1247764479.jpg"]},{"article_id":26825639,"title":"火腿彭彭关于TGS后营业情况的说明","url":"https://www.bilibili.com/opus/847432231890714643","published_date":"2023-10-01","category":"咖啡馆资料","reason":"内容为火腿嘭嘭咖啡馆入场、菜单、营业或TGS安排，与Steam游戏更新公告范围不同。","date_review":"本轮按北京时间筛选发布前7天至发布后3天，共3条Steam候选。内容为火腿嘭嘭咖啡馆入场、菜单、营业或TGS安排，与Steam游戏更新公告范围不同。","date_candidates":[{"id":"5220291886501008087","date":"2023-10-02","title":"2023.10.05 (KST) New E.G.O Target Extraction","url":"https://steamstore-a.akamaihd.net/news/externalpost/steam_community_announcements/5220291886501008087"},{"id":"5220291886501001903","date":"2023-10-02","title":"Oct. 5th Scheduled Update Notice","url":"https://steamstore-a.akamaihd.net/news/externalpost/steam_community_announcements/5220291886501001903"},{"id":"5220291886490109728","date":"2023-09-29","title":"2023.10.05 (KST) New E.G.O Target Extraction","url":"https://steamstore-a.akamaihd.net/news/externalpost/steam_community_announcements/5220291886490109728"}],"body_text":"大家好\n我是月亮计划-火腿彭彭的店长宋明善。\n在出差前往TGS后，我们大多数的员工确诊了新冠病毒。\n虽然一直在确认员工们的健康状态，但我们还是得出了难以照常进行运营的判断。\n我们打算优先隔离员工以防止新冠疫情扩散。因此，10.3与10.4两日将只进行周边贩卖与咖啡厅营业。\n我们对这两天预约的顾客们深感歉意，并希望得到各位的谅解。\n我们打算对这两天的预约的客人在稍后的时间里优先进行安排并保障对应的服务。\n我们将致力于以更加健康的状态迎接火腿彭彭的来宾，谢谢。","read_status":"已读取页面；图片内容按需局部核对，未全文校对","images":["https://i0.hdslb.com/bfs/article/6f8fa2b8cfa834c226c2885b3d6c73a61247764479.jpg"]},{"article_id":26506210,"title":"火腿彭彭日程安排 与 菜品列示","url":"https://www.bilibili.com/opus/840819408198697012","published_date":"2023-09-13","category":"咖啡馆资料","reason":"内容为火腿嘭嘭咖啡馆入场、菜单、营业或TGS安排，与Steam游戏更新公告范围不同。","date_review":"本轮按北京时间筛选发布前7天至发布后3天，共11条Steam候选。内容为火腿嘭嘭咖啡馆入场、菜单、营业或TGS安排，与Steam游戏更新公告范围不同。","date_candidates":[{"id":"5480373588786050635","date":"2023-09-15","title":"Tokyo Game Show 2023 Event Guide","url":"https://steamstore-a.akamaihd.net/news/externalpost/steam_community_announcements/5480373 3056882"},{"id":"5159491482911882856","date":"2023-09-08","title":"2023.09.07 (KST) ~ 2023.10.12 (KST) - Special Attendance Check Event","url":"https://steamstore-a.akamaihd.net/news/externalpost/steam_community_announcements/5159491482911882856"}],"body_text":"本次公告以省流形式翻译。\n火腿彭彭日程安排：\n9月：因为要装修店面、开发新菜品、参加东京游戏展。\n暂停营业。\n10月：提供新的常驻餐饮菜单与常驻周边。（整个10月）\n11月：预定为废墟图书馆收尾人主题。\n预约相关：\n未成年人禁止出入。（有成年人带着也不行）\n顾客需要至少携带一件相关身份证件。\n可以通过NAVER预约（预约不收取费用）\n但为了其他人的体验着想还请节制。\n2区可接受1人或2人预约，3区可接受1-4人的预约。\n10月营业日期为10.3-10.29NAVER预约将于9.17 12:00（KST）开放\n购物规定：\n请遵守预约时间。\n预约时间5min前在商场外进行身份确认与指引。\n为了您的体验着想请务必留意员工的指引内容。\n信用卡支付采用数字支付，现金支付请到柜台。\n正确输入电话号码才可以在线上点单时在Kakaotalk收到叫号通知。\n希望您在收到所有订购的餐品之前一直确认Kakaotalk上的信息。\n为了您的用餐体验着想，请一次性将您想品尝的餐品全部下单。\n后续的下单可能会由于烹饪耗时导致上菜时间延迟。\n饮料与鸡尾酒可在咖啡厅领取。\n其他餐品与甜点可在厨房领取。\n只有在有员工进行导购时才可以购买周边产品。\n在打烊前一刻进行周边购物会导致时间极为紧迫。\n周边商店的参观在营业时间内是可以自由进行的，但是还请您务必不要随意触摸店内的各种装饰与周边样品。\n用餐结束后的餐具还请您务必返还到厨房。\n为了提高服务质量，我们将服务时段定为1h30min。\n每个时段分别从每天的11:00,13:00,15:00,17:00开始。\n以上为HHPP文字公告主要内容。翻译：郑卷儿\n原推：https://twitter.com/Ham_PangPang/status/1701897291421073840?t=f6djGXu4QqBEQiJUNVCZ6w&s=19\n以下为后续公告中的商品图片预览：\n以上，原推：https://twitter.com/Ham_PangPang/status/1701897972202836378?t=V0yQnF_6Qkpj49VSwEGm_A&s=19\n以上，原推：https://twitter.com/Ham_PangPang/status/1701898322339094803?t=4kVJ32ziY-1IIZoPA2FROQ&s=19\n以上，原推：https://twitter.com/Ham_PangPang/status/1701898448419836352?t=jBSCPsp8msah_GhxWCVS1w&s=19\n以上，原推：https://twitter.com/Ham_PangPang/status/1701898571707281903?t=1TXGQTamYtLrMocAS35izg&s=19\n以上，原推：https://twitter.com/Ham_PangPang/status/1701898657334022241?t=yeiyS8U3umEkKVcbSptNhw&s=19\n以上，原推：https://twitter.com/Ham_PangPang/status/1701899386169745415?t=2gHEhFewHvKcE3QGKgbjoQ&s=19\n以上，原推：https://twitter.com/Ham_PangPang/status/1701899458194374677?t=Hf0p1aEKAhKWYJwwLYnEzg&s=19","read_status":"已读取页面；图片内容按需局部核对，未全文校对","images":["https://i0.hdslb.com/bfs/article/94b6a177194794f0f37af8004edefbdaae4264c3.jpg","https://i0.hdslb.com/bfs/article/deae61a9c68ce532ac8e65efc4c99f25079d0b45.jpg","https://i0.hd 通读本通告的全部内容。\nGitHub原发表帖：github.com/orgs/LocalizeLimbusCompany/discussions/165\n组内计划于8月17日到访月亮计划办公室。以下是全部有关此事的信息与过程。\n#1 发送邮件\n23/8/15，我们向月亮计划的Contact以及Business邮箱发送了这封邮件。\n· 截图：\n· 原文：\n존경하는 프로젝트 문에게:\n안녕하십니까.저희는 이미 림버스 컴퍼니의 중국어 번역을 반년간 진행한 LLC 입니다.이번엔 중국에서 직접 한국으로 대표를 파견하여 프로젝트 문을 방문하려고 이편지를 올렸습니다.\n혹시나 contact 이메일이 통하지 못할 만일의 경우를 대비해 business 이메일에도 편지를 보냈습니다.프로젝트 문에게 불편함을 드려서 미리 사과드리겠습니다.그러나 이번에 관련되는 사항은 business 라고 말해도 문제가 없을 것이라고 생각합니다.\n8.17(목요일)에 프로젝트 문을 방문해볼 계획입니다.혹시나 프로젝트 문이 많이 불편하다고 생각되면 프로젝트 문의 생각을 저희에게 알려드리기를 바랍니다.(중국에서 한번 찾아가본다는것은 생각보다 어려운 일이기에,저희의 방문을 거절하지는 말았으면 좋겠습니다)\n간단히 말해드리자면 방문의 목적은 프로젝트 문에게 저희 모듈 및 성과를 보여주고 림버스 컴퍼니의 중국어 공식적 도입을 위해 협상을 진행하는 것입니다.더욱 상세한 사항은 8.17에 알려드리겠습니다.\n만약 8.17전 까지 이편지에 대한 회답이 없으면 그냥 프로젝트 문에게 다른 의견이 없다는 것으로 여기고 계획대로 방문할 예정입니다.마지막으로 프로젝트문의 사업이 잘되여 나가기를 축원합니다.\n2023.08.15\nLLC 올림\n#2 收到邮件\n23/8/16，我们从Business邮箱收到回复。\n· 截图：\n· 原文：\n안녕하세요. LCC님. 처음 인사 드립니다. 저는 프로젝트문 경영지원팀 소속 유현수라고 합니다. 메일 확인 후 답변드리고자 첫 인사를 메일로 보내게 된 점 양해 부탁드립니다.\n직접 번역을 자처해 보다 많은 중국 게이머분들이 쾌적하게 게임 진행을 하고자하는 귀하의 선의와 자사 게임에 대한 뜨거운 성원이 느껴져 너무나 감사한 마음입니다.\n공식적인 번역 계약을 위해 직접 방문을 원하신다 말씀주어 너무나 감사한 마음이나 방문은 어려울 것 같다 미리 말씀드립니다.\n현재 중국 공식 서비스를 준비하기에는 현재 내부적으로 여유가 턱 없이 부족해 어려운 상황입니다.\n그리고 중국의 게임관련법에 맞춰 다시 대응하기에 시간이 많이 소요되며 이전 작과 다르게 Limbus Company의 경우 라이브 서비스 중으로 중국 판호 등을 위해 법적 자문 및 문서 작업들이 지속적으로 필요할 것이다 사료됩니다.\n하여 중국 공식 서비스는 현재로서 굉장히 어려운 상황임을 감안해주시면 감사하겠습니다.\n지속적인 관심과 번역 작업은 너무나 감사한 마음이오나 방문은 어려운 점 다시 한번 양해 부탁드립니다.\n감사합니다.\n유현수 드림.\n&lt;이하 번역기를 통해 내용 전달드리며 내용의 오류가 있을 수 있음을 양해 바랍니다.&gt;\n&lt;请注意，以下内容由翻译机员翻译，可能存在错误&gt;\n你好。LCC\n我想自我介绍一下 我是项目管理支持团队的 Hyunsoo Yoo。\n请您理解，我通过电子邮件向您致以第一声问候，以便在查看您的电子邮件后给您回复。\n我们非常感谢您对我们游戏的良苦用心和热情支持，也非常感谢您愿意亲自翻译我们的游戏，让更多的中国玩家享受到游戏的乐趣。\n我们非常感谢你愿意亲自来我们公司签订正式的翻译协议，但我们很遗憾地告诉你，这是不可能的。\n目前，我们没有足够的内部资源来准备官方中文服务。\n此外，重新应对中国游戏相关法律需要大量时间，与往年不同的是，Limbus 公司正处于实服过程中，中方审批需要不断进行法律咨询和文件准备工作。\n因此，我们希望您能考虑到官方中服目前正处于非常困难的境地。\n我们非常感谢您一直以来的关心和翻译工作，但很遗憾我们无法拜访您。\n谢谢。\nYoo Hyunsoo.\n· 我们的反应与评论：\n很不幸的，我们认为月计误解了我们的意图。比起要求一个商业翻译合约，我们想要的其实是更多认可与一些(可能的)帮助。\n我们很清楚我们仅仅是一个社区汉化组，不可能提出那样傲慢自大的要求。\n虽然我相信我们应该能在第一封邮件中把我们的来意讲的更清楚些，但不管怎样，月计还是委婉的拒绝了我们线下到访的提议。\n因此，我们取消了次日的访问计划。\n该赴韩组员在回国之前严重高烧，勉强回国后未能工作。因此，我们还未跟进任何对月计的回复。\n不过，感谢这位组员的牺牲和贡献，我们得以收到第二封来自月计的官方回信。这本身就已经是一次极大的成功了。\n以下是我们接到的第一次回信的情况：\n当前，他的身体已经恢复。我们也在相应准备新的回复以解开这些小小误会。","read_status":"已读取页面；图片内容按需局部核对，未全文校对","images":["https://i0.hdslb.com/bfs/article/874199a9855b8ea3ef7bf7bdb31ababf30e913d0.png","https://i0.hdslb.com/bfs/article/a6f748124b95354717d45fc421a280de63c644ab.png","https://i0.hdslb.com/bfs/article/7ac21979f9d2ac540a23ed5d8eb6f7d00327891f.png"]},{"article_id":25808468,"title":"月亮计划关于WonderLab下架的公告","url":"https://www.bilibili.com/read/cv25808468","published_date":"2023-08-17","category":"作品与版权公告","reason":"正文涉及WonderLab下架或Leviathan漫画版权，与原候选游戏提取/间章预告不同；检索本次Steam归档标题后未找到同篇，保留原转载入口。","date_review":"本轮按北京时间筛选发布前7天至发布后3天，共5条Steam候选。正文涉及WonderLab下架或Leviathan漫画版权，与原候选游戏提取/间章预告不同；检索本次Steam归档标题后未找到同篇，保留原转载入口。","date_candidates":[{"id":"5127964289175919920","date":"2023-08-18","title":"2023.08.24(KST) New Identity Target Extraction","url":"https://steamstore-a.akamaihd.net/news/externalpost/steam_community_announcements/5127964289175919920"},{"id":"5839532486224278816","date":"2023-08-14","title":"Notice on Planned UI/UX Improvements","url":"https://steamstore-a.akamaihd.net/news/externalpost/steam_community_announcements/5839532486224278816"},{"id":"5839532486224273542","date":"2023-08-14","title":"Notice on Ongoing Optimization Process","url":"https://steamstore-a.akamaihd.net/news/externalpost/steam_community_announcements/5839532486224273542"},{"id":"5839532486224259151","date":"2023-08-14","title":"August 17th Scheduled Update Notice","url":"https://steamstore-a.akamaihd.net/news/externalpost/steam_community_announcements/5839532486224259151"},{"id":"5839532486209821349","date":"2023-08-10","title":"List of Issues Identified as of Aug 10 Update","url":"https://steamstore-a.akamaihd.net/news/externalpost/steam_community_announcements/5839532486209821349"}],"body_text":"","read_status":"已读取页 使体力最低的一名友方单位与自               身基于最大体力恢复一定比例的体力\nE.G.O侵蚀：赤瞳(开)（嫉妒 斩击 1硬币）\n[无差别攻击]\n随机指定目标\n[范围攻击]\n指定三个行动槽\n主要攻击对象的速度比自身低于一定值时，硬币威力增加\n硬币I  :  \n[命中时]\n若\n目标拥有一定层数的束缚，增加造成的伤害\n             使用该技能使敌方陷入混乱或者是击杀敌方单位时，使体力最低的一名友方单位与自               身基于最大体力恢复一定比例的体力\n被动技能：捕食\n如果同一回合内恢复的体力大于最大体力的一定比例时时，下回合使自身获得\n强壮\n。\n以上内容仅供参考，实际情况以游戏内容与汉化模组为准。\n翻译：零协会斩打突（小白家的白小白 郑卷儿）\n闭眼原推：https://twitter.com/LimbusCompany_B/status/1673258004458905601?t=BQh6uLGW-TfUkF8NdclxWQ&amp;s=19\n开眼原推：https://twitter.com/LimbusCompany_B/status/1673258183941570561?t=RNw2S93UoUSifzfyPUMDcg&amp;s=19","read_status":"已读取页面；图片内容按需局部核对，未全文校对","images":["https://i0.hdslb.com/bfs/article/129b7b7112ab44660ef54751da7166563584d809.jpg","https://i0.hdslb.com/bfs/article/4199a5b8e52361be6e30c9f40209bbfc2ac0fd66.jpg"]},{"article_id":24601368,"title":"【零协汉化】定向人格提取: K公司 & 技术解放联合 技能概览","url":"https://www.bilibili.com/read/cv24601368","published_date":"2023-06-26","category":"未在Steam归档找到同一技能预览","reason":"本次905条Steam归档没有对应日期的同内容提取技能预览独立条目；同期维护公告提及角色，但不足以证明是同一正文。","date_review":"本轮按北京时间筛选发布前7天至发布后3天，共5条Steam候选。本次905条Steam归档没有对应日期的同内容提取技能预览独立条目；同期维护公告提及角色，但不足以证明是同一正文。","date_candidates":[{"id":"5124581515268751079","date":"2023-06-26","title":"June 29th Scheduled Update Notice","url":"https://steamstore-a.akamaihd.net/news/externalpost/steam_community_announcements/5124581515268751079"},{"id":"5124581515268731558","date":"2023-06-26","title":"Intro to New Contents for June 29th - Mirror of Mirrors (Mirror Dungeon #2)","url":"https://steamstore-a.akamaihd.net/news/externalpost/steam_community_announcements/5124581515268731558"},{"id":"5124581515257804281","date":"2023-06-23","title":"Notice on System Changes to Offense/Defense Levels","url":"https://steamstore-a.akamaihd.net/news/externalpost/steam_community_announcements/5124581515257804281"},{"id":"5896948309853342716","date":"2023-06-19","title":"Notice on Issue with Sin Affinity Power Up/Down Status Effects","url":"https://steamstore-a.akamaihd.net/news/externalpost/stea amstore-a.akamaihd.net/news/externalpost/steam_community_announcements/5151600576590477691"},{"id":"5151600576590240160","date":"2023-05-26","title":"Guide on Season 2: Reminiscence","url":"https://steamstore-a.akamaihd.net/news/externalpost/steam_community_announcements/5151600576590240160"}],"body_text":"承蒙诸位关照，这里是月计。\n我们预定于06.08的更新维护中再次调整理智值的增减条件及数值。\n调整理智值增减数值的理由与本次更新相同。\n现版本中理智值增加数值过高，\n导致理智值时常会维持在最大值即45点。\n因此经常需要对正面率的平衡性以及战斗规划作出调整。\n为避免此类状况并提高战斗规划的多样性，\n我们认为需对理智值作出平衡调整。\n但更新的同时，推进该功能有一定难度，且游戏体验的测试实施不够充分。\n因此，实际的理智值会维持在比预计更低的数值，\n所以没能达到预期的游戏体验。\n没能充分测试关于影响到游戏体验的数值变动，我们由衷感到抱歉。\n在下次6.8的定期更新中，我们将会更改理智值变动条件以及数值。\n详情请您确认下表。\n为诸位的游玩带来了不便，我们深感歉意。\n为了能给诸位带来更好的游戏体验，\n我们将竭尽全力。\n感谢您的支持。\n翻译：玉佩\n原推1：https://twitter.com/limbuscompany_b/status/1664179595229401094?s=61&amp;t=SbsVkd_tbp8_rtGUZjgHkQ\n原推2：https://twitter.com/limbuscompany_b/status/1664179727933009925?s=61&amp;t=SbsVkd_tbp8_rtGUZjgHkQ","read_status":"已读取页面；图片内容按需局部核对，未全文校对","images":["https://i0.hdslb.com/bfs/article/d106cca066e1aecb695dac37254868599bf57612.png"]},{"article_id":23804750,"title":"【零协汉化】火腿嘭嘭入场指南","url":"https://www.bilibili.com/read/cv23804750","published_date":"2023-05-20","category":"咖啡馆资料","reason":"内容为火腿嘭嘭咖啡馆入场、菜单、营业或TGS安排，与Steam游戏更新公告范围不同。","date_review":"本轮按北京时间筛选发布前7天至发布后3天，共5条Steam候选。内容为火腿嘭嘭咖啡馆入场、菜单、营业或TGS安排，与Steam游戏更新公告范围不同。","date_candidates":[{"id":"5140340943323014188","date":"2023-05-23","title":"Notice Regarding Abuse of Convenience-store Payment in Japan Google Play","url":"https://steamstore-a.akamaihd.net/news/externalpost/steam_community_announcements/5140340943323014188"},{"id":"5140340943318645714","date":"2023-05-22","title":"May 25th Scheduled Update Notice","url":"https://steamstore-a.akamaihd.net/news/externalpost/steam_community_announcements/5140340943318645714"},{"id":"5140340943308212272","date":"2023-05-19","title":"Season2 Teaser - Reminiscence","url":"https://steamstore-a.akamaihd.net/news/externalpost/steam_community_announcements/5140340943308212272"},{"id":"6557848386955344546","date":"2023-05-15","title":"2023.05.18 (KST) New E.G.O","url":"https://steamstore-a.akamaihd.net/news/externalpost/steam_community_announcements/6557848386955344546"},{"id":"6557848386954700973","date":"2023-05-15","title":"May 18th Scheduled Update Notice","url":"https://steamstore-a.akamaihd.net/news/externalpost/steam_community_announcements/6557848386954700973"}],"body_text":"您好，这里是月亮计划。\n接下来将为您讲述火腿嘭嘭的入场指南。\n【1】\n关于预约入场前的语音通知，\n该语音通知是为给各位顾客提供更为顺畅的体验而准备，\n所以希望您能仔细聆听，谢谢。\n只有听从语音通知才能在场所体验中不出现差错。\n为了其他顾客着想，\n请不要在通知期间大声喧哗。\n【2】\n请在下单之后通过Kakaotalk确认叫号。\n咖啡类餐点可以较快取餐，但是由于炸鸡类餐点耗时较长\n所以请在下单后，周期性的确认Kakaotalk\n或是注意工作人员的订单叫号。\n【3】\n离开时，请务必将使用过的餐具送回厨房。\n为使所有访客在体验期间的体验更加顺畅，\n以上几点还请多多包涵。\n为能提供令人满意的体验，我们将竭尽全力。\n谢谢。\n原图\n原推：https://twitter.com/ham_pangpang/status/1659829553915899904?s=61&amp;t=SbsVkd_tbp8_rtGUZjgHkQ\n翻译：郑卷儿","read_status":"已读取页面；图片内容按需局部核对，未全文校对","images":["https://i0.hdslb.com/bfs/article/5a767614e8098a17c02bb107221a8b5fbe2ff88b.jpg"]}]}</script><script>
const d=JSON.parse(document.getElementById('supplement-data').textContent),q=document.getElementById('q'),cat=document.getElementById('category'),box=document.getElementById('results');let limit=40;

for(const c of [...new Set(d.records.map(x=>x.category))]){const o=document.createElement('option');o.value=c;o.textContent=c;cat.append(o);}
function el(t,s){const e=document.createElement(t);if(s)e.textContent=s;return e;}
function render(reset=true){if(reset)limit=40;const key=q.value.trim().toLowerCase(),rows=d.records.filter(r=>(!cat.value||cat.value===r.category)&&(!key||[r.title,r.category,r.reason,r.body_text,r.published_date].join(' ').toLowerCase().includes(key)));box.replaceChildren();document.getElementById('count').textContent=`找到${rows.length}篇`;for(const r of rows.slice(0,limit)){const a=el('article');a.append(el('p',r.published_date+' · '+r.category),el('h2',r.title),el('p',r.reason));if(r.date_review)a.append(el('p',r.date_review));const link=el('a','打开原条目');link.href=r.url;link.target='_blank';link.rel='noopener noreferrer';a.append(link);if(r.body_text.trim()){const v=el('details');v.append(el('summary','展开页面文字正文'),el('pre',r.body_text));a.append(v);}a.append(el('p',r.read_status));box.append(a);}if(rows.length>limit){const b=el('button','再显示40篇');b.onclick=()=>{limit+=40;render(false)};box.append(b);}}
q.oninput=()=>render();cat.onchange=()=>render();render();
