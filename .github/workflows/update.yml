name: 更新并发布公告库
on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: announcement-pages
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: 检查并收录新公告
        run: python scripts/update_steam.py
      - name: 保存更新历史
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html Steam公告查阅库.html
          if ! git diff --cached --quiet; then
            git commit -m '自动检查并更新Steam公告'
            git push
          fi
      - uses: actions/configure-pages@v5
      - name: 整理网站文件
        run: |
          mkdir _site
          find . -maxdepth 1 -type f \( -name '*.html' -o -name '*.md' -o -name '*.json' -o -name '*.csv' -o -name '.nojekyll' \) -exec cp {} _site/ \;
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: 发布网站
        id: deployment
        uses: actions/deploy-pages@v4
